# Morning Dew backend canary + on-demand diagnostics.
#
# Probes the AI endpoints from a GitHub runner (which can reach Render) and
# prints SANITIZED results only: HTTP status plus the configured/structured/
# error fields. Never prints brief text, email content, or calendar names —
# this is a public repo, so response bodies stay out of the logs.
#
# Runs daily at 20:30 UTC (≈6:30am Brisbane, before the morning routine) and
# FAILS the job when either debrief endpoint is unhealthy — GitHub then emails
# the repo owner, so a dead debrief is caught before breakfast instead of at it.
name: Morning Dew diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'

permissions: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe AI + calendar endpoints
        run: |
          BASE="https://morning-dew-backend-3w0m.onrender.com"
          FAILED=0
          probe () {
            local name="$1" url="$2" critical="$3"
            local body code
            body=$(curl -sS --max-time 110 -w '\n%{http_code}' "$url" 2>&1) || { echo "$name: curl failed: $body"; [ "$critical" = "critical" ] && FAILED=1; return; }
            code=$(echo "$body" | tail -1)
            body=$(echo "$body" | sed '$d')
            local len=${#body}
            # Sanitized field extraction only — no content.
            local configured error
            configured=$(echo "$body" | jq -r 'if has("configured") then .configured else "n/a" end' 2>/dev/null || echo 'not-json')
            error=$(echo "$body" | jq -r '.error // "none"' 2>/dev/null | head -c 300)
            echo "== $name =="
            echo "   http=$code bytes=$len configured=$configured"
            echo "   error=$error"
            if [ "$critical" = "critical" ]; then
              if [ "$code" != "200" ] || [ "$configured" != "true" ] || [ "$error" != "none" ]; then
                echo "   ^^ UNHEALTHY — this will fail the canary"
                FAILED=1
              fi
            fi
          }
          # Wake the backend first (free tier may be cold), then test.
          curl -sS -o /dev/null --max-time 90 "$BASE/api/health" || true
          probe "health"        "$BASE/api/health"        "critical"
          probe "brief"         "$BASE/api/brief"         "critical"
          probe "email"         "$BASE/api/email"         ""
          probe "email-summary" "$BASE/api/email-summary" "critical"
          # calendar-add GET lists calendars; informational only (falls back to
          # the .ics sheet in-app, so it never blocks the debriefs).
          body=$(curl -sS --max-time 60 "$BASE/api/calendar-add" || echo '{}')
          echo "== calendar-add =="
          echo "   configured=$(echo "$body" | jq -r '.configured // "n/a"' 2>/dev/null) calendars=$(echo "$body" | jq -r '(.calendars | length) // 0' 2>/dev/null) error=$(echo "$body" | jq -r '.error // "none"' 2>/dev/null | head -c 200)"
          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "CANARY FAILED: one of the AI debrief endpoints is unhealthy."
            echo "Check Render logs + ANTHROPIC_API_KEY / credits, then re-run this workflow."
            exit 1
          fi
          echo ""
          echo "All debrief endpoints healthy."
