<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Morning Dew</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A0C10" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Morning Dew" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<style>
  :root {
    --text: #f5f7fb;
    --muted: rgba(245, 247, 251, 0.56);
    --glass-bg: rgba(255, 255, 255, 0.045);
    --glass-bg-soft: rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.10);
    --glass-highlight: rgba(255, 255, 255, 0.14);
    --accent: #ffb22e;
    --home-accent: #5599ff;
    --bar-pink: #FF4D8D;
    --bar-orange: #FF9F43;
    --bar-blue: #3D7BFF;
    --danger: #ff6b6b;
    --ok: #34e0c4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow-x: hidden;
  }
  body {
    position: relative;
    background: linear-gradient(168deg, #0c1020 0%, #0a0b12 55%, #0a080f 100%);
    background-attachment: fixed;
    min-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(env(safe-area-inset-top) + 0.3rem) 1.1rem 0;
    gap: 0;
  }
  main.home { width: 100%; max-width: 460px; }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(64px);
    opacity: 0.5;
    z-index: 0;
    will-change: transform;
  }
  .blob-a {
    width: 72vw; height: 72vw;
    top: -20vw; left: -18vw;
    background: radial-gradient(circle, #4d7fff, transparent 70%);
    opacity: 0.52;
    animation: drift1 22s ease-in-out infinite alternate;
  }
  .blob-b {
    width: 75vw; height: 75vw;
    bottom: -30vw; right: -28vw;
    background: radial-gradient(circle, #b830e0, transparent 70%);
    opacity: 0.42;
    animation: drift2 26s ease-in-out infinite alternate;
  }
  .blob-c {
    width: 55vw; height: 55vw;
    top: 30vh; right: -20vw;
    background: radial-gradient(circle, #ff7040, transparent 70%);
    opacity: 0.32;
    animation: drift3 30s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(6vw, 8vh); } }
  @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-8vw, -6vh); } }
  @keyframes drift3 { from { transform: translate(0,0); } to { transform: translate(-5vw, 5vh); } }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  .greeting-block { padding: 0 0.25rem; }
  .greeting-date {
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .greeting-phrase {
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--muted);
    margin-top: 0.3rem;
  }
  .greeting-name {
    font-size: 2.5rem;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.01em;
    background: linear-gradient(120deg, #ffffff, #cfe0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .updated-label {
    color: var(--muted); font-size: 0.74rem; font-weight: 600;
    margin-top: 0.45rem; opacity: 0.75;
  }

  .glass {
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    overflow: hidden;
  }
  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--glass-highlight), transparent 45%);
    opacity: 0.22;
    pointer-events: none;
  }

  /* ---- Card colour variants (locally re-scope text vars so children adapt) ---- */
  .card-cream {
    background: #efe5d4;
    --text: #33241a; --muted: rgba(51,36,26,0.62); --glass-border: rgba(0,0,0,0.08);
    color: var(--text);
  }
  .card-amber {
    background: linear-gradient(150deg, #ffc24d 0%, #f5a623 100%);
    --text: #3a2710; --muted: rgba(58,39,16,0.66); --glass-border: rgba(0,0,0,0.10);
    color: var(--text);
  }
  .card-tan {
    background: #d9bfa6;
    --text: #3a2a1c; --muted: rgba(58,42,28,0.62); --glass-border: rgba(0,0,0,0.08);
    color: var(--text);
  }
  .card-dark { background: rgba(28,20,14,0.62); }
  .card-cream::before, .card-amber::before, .card-tan::before { opacity: 0; }

  /* ---- Welcome header ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 0.25rem; }
  .brand { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; color: var(--accent); }
  .brand small { display: block; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin-top: -0.1rem; }
  .welcome { padding: 0 0.25rem; }
  .welcome-hi { font-size: 1.15rem; font-weight: 600; color: var(--muted); }
  .welcome-name {
    margin: 0.1rem 0 0; font-size: 2.7rem; font-weight: 800; line-height: 1.02; letter-spacing: -0.02em;
    background: linear-gradient(110deg, #fff5e6, var(--accent)); -webkit-background-clip: text;
    background-clip: text; color: transparent;
  }
  .welcome-date { color: var(--muted); font-size: 0.86rem; font-weight: 600; margin-top: 0.5rem; }

  /* ---- Bento grid ---- */
  .bento {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.7rem; align-items: start;
  }
  .bento > * { min-width: 0; }
  .span2 { grid-column: span 2; }
  .bento-card { padding: 1rem 1.05rem; }
  .bento-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.6rem; letter-spacing: -0.01em; }
  .bento-head { display: flex; align-items: center; gap: 0.5rem; }
  .bento-head .bento-title { margin-bottom: 0; margin-right: auto; }

  /* Stat tiles */
  .stat-tile { padding: 0.8rem 0.9rem; }

  /* ---- Single-screen launcher home ---- */
  main.home {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column; gap: 0.85rem;
  }
  .home-tiles {
    min-height: 46vh;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0.7rem;
  }
  .home-tile {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
    gap: 0.15rem; padding: 1rem; min-height: 0; overflow: hidden;
    text-align: left; cursor: pointer;
    transition: transform 0.12s ease;
  }
  .home-tile:active { transform: scale(0.97); }

  /* ---- Readiness (Apple Watch / Bevel) ---- */
  .health-card { padding: 1rem 1.1rem 1.1rem; text-align: left; cursor: pointer; transition: transform 0.12s ease; }
  .health-card:active { transform: scale(0.99); }
  .health-card-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.7rem; }
  .health-card-title { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.01em; }
  .health-card-meta { font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-left: auto; }
  .health-rings { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; }
  .hring { display: flex; flex-direction: column; align-items: center; gap: 0.45rem; }
  .hring-wrap { position: relative; width: 5.4rem; height: 5.4rem; }
  .hring-wrap svg { width: 100%; height: 100%; display: block; }
  .hring-val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
  .hring-label { font-size: 0.78rem; font-weight: 700; color: var(--muted); }
  .rtrack { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 16; }
  .health-empty { color: var(--muted); font-size: 0.86rem; line-height: 1.4; padding: 0.3rem 0.1rem; }
  .health-empty b { color: var(--text); font-weight: 700; }
  /* Detail-section rings (larger) */
  .health-detail-rings { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; margin: 0.4rem 0 1.2rem; }
  .health-detail-rings .hring-wrap { width: 6.6rem; height: 6.6rem; }
  .health-detail-rings .hring-val { font-size: 1.55rem; }
  .health-foot-note { color: var(--muted); font-size: 0.82rem; line-height: 1.45; }
  /* Redesigned health detail page */
  .hd-hero { text-align: center; padding: 1.6rem 1rem 1.4rem; }
  .hd-hero-score { font-size: 4.5rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .hd-hero-word { font-size: 1.05rem; font-weight: 700; margin-top: 0.3rem; }
  .hd-hero-trend { font-size: 0.8rem; color: var(--muted); margin-top: 0.35rem; }
  .hd-dual { display: flex; gap: 0.65rem; }
  .hd-dual-card { flex: 1; padding: 1rem 0.9rem; text-align: center; }
  .hd-dual-val { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .hd-dual-lbl { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-top: 0.25rem; }
  .hd-dual-word { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
  .hd-chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .hd-chip { flex: 1; min-width: 4.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 14px; padding: 0.6rem 0.65rem; }
  .hd-chip-val { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.01em; }
  .hd-chip-lbl { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 0.12rem; }
  .hd-target-row { display: flex; justify-content: space-between; align-items: center; }
  .hd-target-band { font-size: 1.2rem; font-weight: 800; color: var(--bar-orange); }
  .hd-chart-hdr { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.6rem; }

  /* Oura-style Health full-screen page */
  .health-page {
    position: fixed; inset: 0; z-index: 60;
    background: linear-gradient(168deg, #0c1020 0%, #0a0b12 55%, #0a080f 100%);
    overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    animation: debriefIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .health-page[hidden] { display: none; }
  .health-page.closing { animation: debriefOut 0.22s ease forwards; }

  /* Trends / self-insight full-screen page (mirrors .health-page / .debrief-page) */
  .trends-page {
    position: fixed; inset: 0; z-index: 60;
    background: linear-gradient(168deg, #0c1020 0%, #0a0b12 55%, #0a080f 100%);
    overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 0.8rem) 1.1rem calc(env(safe-area-inset-bottom) + 2rem);
    display: flex; flex-direction: column; gap: 1rem;
    animation: debriefIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .trends-page[hidden] { display: none; }
  .trends-page.closing { animation: debriefOut 0.22s ease forwards; }
  .trend-section-hdr { position: relative; z-index: 1; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0.2rem 0 -0.35rem; }
  .trend-chart-wrap { position: relative; touch-action: pan-y; }
  /* Athlytic-style charts render axis/point labels as SVG text, so the svg
     keeps its intrinsic aspect (height:auto) instead of stretching — stretched
     text is the tell of a non-professional chart. */
  .trend-svg { width: 100%; height: auto; display: block; }
  .trend-card-title { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 0.7rem; }
  .trend-seg { display: flex; background: rgba(255,255,255,0.07); border-radius: 999px; padding: 3px; margin-bottom: 0.9rem; }
  .trend-seg-btn {
    flex: 1; font-family: inherit; font-size: 0.82rem; font-weight: 700; color: var(--muted);
    background: none; border: none; border-radius: 999px; padding: 0.45rem 0; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .trend-seg-btn.active { background: rgba(255,255,255,0.16); color: var(--text); }
  .trend-sum-row { display: flex; gap: 0.55rem; margin-top: 0.8rem; }
  .trend-sum { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 0.5rem 0.6rem; text-align: center; }
  .trend-sum-val { font-size: 1.02rem; font-weight: 800; letter-spacing: -0.01em; }
  .trend-sum-lbl { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 0.12rem; }
  .trend-leg-band { width: 14px; height: 10px; border-radius: 3px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.25); display: inline-block; flex-shrink: 0; }
  .trend-leg-line { width: 16px; height: 0; border-top: 2.5px solid; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .trend-legend { display: flex; gap: 1.1rem; margin-top: 0.5rem; font-size: 0.78rem; color: var(--muted); }
  .trend-leg-item { display: flex; align-items: center; gap: 0.35rem; }
  .trend-leg-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .trend-tooltip {
    position: absolute; top: 2px; transform: translateX(-50%);
    background: rgba(10,12,20,0.94); border: 1px solid var(--glass-border);
    border-radius: 10px; padding: 0.3rem 0.55rem; font-size: 0.72rem; font-weight: 600;
    white-space: nowrap; pointer-events: none; color: var(--text);
  }
  .trend-tooltip[hidden] { display: none; }
  .trend-stat-row { display: flex; gap: 0.7rem; }
  .trend-stat { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 14px; padding: 0.7rem 0.8rem; }
  .trend-stat-val { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; }
  .trend-stat-lbl { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 0.15rem; }
  .trend-pattern { display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.4rem 0; font-size: 0.88rem; line-height: 1.4; }
  .trend-pattern-chip { flex-shrink: 0; margin-top: 0.16rem; font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.15rem 0.45rem; border-radius: 999px; white-space: nowrap; }
  .trend-pattern-chip.high { background: rgba(52,224,196,0.16); color: var(--ok); }
  .trend-pattern-chip.medium { background: rgba(255,178,46,0.16); color: var(--accent); }
  .trend-pattern-chip.low { background: rgba(255,255,255,0.08); color: var(--muted); }
  .trend-empty { font-size: 0.86rem; color: var(--muted); line-height: 1.5; }
  .trend-entry-card { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .trend-entry-arrow { color: var(--muted); font-size: 1.1rem; }

  /* ===== Fitness home (Readiness → Today tab) ===== */
  .fh-greet { padding: 14px 4px 0; }
  .fh-hello { font-size: 13px; color: rgba(255,255,255,0.55); }
  .fh-title { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 500; color: #fff; margin-top: 3px; line-height: 1.2; }
  .fh-coach { display: flex; align-items: flex-start; gap: 10px; background: #171a20; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 13px 15px; margin-top: 14px; }
  .fh-coach-ico { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: rgba(61,123,255,0.16); display: flex; align-items: center; justify-content: center; }
  .fh-coach-body { flex: 1; min-width: 0; }
  .fh-coach-target { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: #7fb2ff; text-transform: uppercase; }
  .fh-coach-txt { font-size: 12.5px; line-height: 1.5; color: rgba(255,255,255,0.6); margin-top: 3px; }
  .fh-sec-hdr { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 4px 8px; }
  .fh-sec-title { font-family: Georgia, 'Times New Roman', serif; font-size: 21px; font-weight: 500; color: #fff; }
  .fh-sec-sub { font-size: 11.5px; color: rgba(255,255,255,0.45); }
  .fh-act-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .fh-act-card {
    position: relative; background: #171a20; border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px; padding: 14px 14px 12px; text-align: left; cursor: pointer;
    font-family: inherit; color: #fff; min-height: 96px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  }
  .fh-act-card.done { border-color: rgba(52,224,196,0.4); background: rgba(52,224,196,0.08); }
  .fh-act-top { display: flex; align-items: center; justify-content: space-between; }
  .fh-act-emoji { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .fh-act-card.done .fh-act-emoji { background: rgba(52,224,196,0.16); }
  .fh-act-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; font-size: 12px; color: transparent; }
  .fh-act-card.done .fh-act-check { background: var(--ok); border-color: var(--ok); color: #09332b; }
  .fh-act-name { font-size: 14.5px; font-weight: 700; }
  .fh-act-card.done .fh-act-name { text-decoration: line-through; opacity: 0.75; }
  .fh-act-time { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: #9b8cff; margin-top: 2px; }
  .fh-act-del { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.45); font-size: 11px; line-height: 1; cursor: pointer; display: none; align-items: center; justify-content: center; }
  .fh-act-grid.editing .fh-act-del { display: flex; }
  .fh-act-grid.editing .fh-act-check { display: none; }
  .fh-add-card {
    background: rgba(255,255,255,0.04); border: 1.5px dashed rgba(255,255,255,0.2);
    border-radius: 18px; min-height: 96px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; color: rgba(255,255,255,0.55);
    font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .fh-add-plus { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
  .fh-edit-btn { background: none; border: none; font-family: inherit; font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,0.45); cursor: pointer; padding: 2px 4px; }
  .fh-form { background: #171a20; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 14px 15px; margin-top: 11px; }
  .fh-form-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .fh-type-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px; padding: 6px 11px; font-family: inherit; font-size: 12px; font-weight: 700;
    color: rgba(255,255,255,0.75); cursor: pointer;
  }
  .fh-type-chip.sel { background: rgba(61,123,255,0.25); border-color: rgba(61,123,255,0.6); color: #fff; }
  .fh-form-bottom { display: flex; gap: 8px; margin-top: 11px; align-items: center; }
  .fh-time-input { font-family: inherit; font-size: 15px; font-weight: 800; color: #fff; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 7px 10px; color-scheme: dark; }
  .fh-name-input { flex: 1; min-width: 0; font-family: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px 10px; margin-top: 9px; width: 100%; }
  .fh-name-input::placeholder { color: rgba(255,255,255,0.35); }
  .fh-save-btn { background: rgba(244,244,240,0.92); color: #16110c; font-size: 13px; font-weight: 700; padding: 9px 18px; border-radius: 999px; border: none; cursor: pointer; font-family: inherit; }

    line-height: 1;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .icon-link:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.16); }

  /* ---- weather ---- */
  .weather-card { padding: 1.5rem 1.4rem; text-align: center; }
  .weather-icon { font-size: 3.6rem; line-height: 1; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35)); }
  .temp { font-size: 3.8rem; font-weight: 700; margin: 0.1rem 0; letter-spacing: -0.02em; }
  .desc { font-size: 1.05rem; font-weight: 600; }
  .location { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
  .stats-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .stat-card { padding: 0.85rem 1rem; text-align: left; }
  .stat-label { color: var(--muted); font-size: 0.74rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-value { font-size: 1.25rem; font-weight: 700; margin-top: 0.15rem; }

  /* ---- 7-day forecast ---- */
  .forecast-card { padding: 0.5rem 1.1rem; }
  .forecast-row {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .forecast-row:last-child { border-bottom: none; }
  .fc-day { width: 2.6rem; font-weight: 600; font-size: 0.92rem; }
  .fc-icon { width: 1.9rem; text-align: center; font-size: 1.3rem; }
  .fc-rain {
    width: 3.1rem; font-size: 0.8rem; font-weight: 600;
    color: #5fb0ff; text-align: right; white-space: nowrap;
  }
  .fc-rain.dry { color: var(--muted); opacity: 0.5; }
  .fc-temps { flex: 1; display: flex; align-items: center; gap: 0.5rem; }
  .fc-lo { color: var(--muted); font-size: 0.9rem; width: 1.9rem; text-align: right; }
  .fc-hi { font-weight: 700; font-size: 0.95rem; width: 1.9rem; }
  .fc-track {
    flex: 1; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,0.12); overflow: hidden; position: relative;
  }
  .fc-fill {
    position: absolute; top: 0; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #4aa3ff, #ff8a3a);
  }

  /* ---- generic list cards (calendar / reminders / email) ---- */
  .list-card { padding: 1rem 1.1rem; }
  .list-row {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    padding: 0.65rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.10);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row-title { font-weight: 600; font-size: 0.95rem; }
  .list-row-meta { color: var(--muted); font-size: 0.8rem; margin-top: 0.15rem; }
  .empty-state, .error-state, .placeholder-state {
    position: relative; z-index: 1;
    color: var(--muted); font-size: 0.88rem; padding: 0.4rem 0.1rem; line-height: 1.4;
  }
  .error-state { color: var(--danger); }
  .placeholder-state code {
    background: rgba(255,255,255,0.10); padding: 0.1rem 0.35rem; border-radius: 6px; font-size: 0.78rem;
  }
  .loading-state {
    position: relative; z-index: 1;
    color: var(--muted); font-size: 0.88rem; padding: 0.4rem 0.1rem;
  }
  .tag {
    display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 0.12rem 0.45rem; border-radius: 8px; margin-bottom: 0.3rem;
  }
  .tag-urgent { background: rgba(255, 107, 107, 0.18); color: var(--danger); }
  .tag-new { background: rgba(52, 224, 196, 0.18); color: var(--ok); }

  /* ---- Outlook-style email list ---- */
  .mail-card { padding: 0.4rem 0.6rem; }
  .mail-scroll {
    position: relative; z-index: 1;
    max-height: 320px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .mail-row {
    display: flex; align-items: flex-start; gap: 0.7rem;
    padding: 0.7rem 0.45rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    text-decoration: none; color: var(--text);
    transition: background 0.12s ease;
  }
  .mail-row:last-child { border-bottom: none; }
  .mail-row:active { background: rgba(255,255,255,0.08); }
  .mail-avatar {
    flex-shrink: 0;
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; font-weight: 700; color: #fff;
    margin-top: 0.1rem;
  }
  .mail-body { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .mail-top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem;
  }
  .mail-sender {
    font-weight: 700; font-size: 0.95rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mail-date { flex-shrink: 0; color: var(--muted); font-size: 0.78rem; }
  .mail-subject {
    font-size: 0.9rem; margin-top: 0.05rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mail-snippet {
    color: var(--muted); font-size: 0.82rem; line-height: 1.3; margin-top: 0.1rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .mail-unread-dot {
    flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%;
    background: #3a8dff; margin: 0.5rem 0 0 -0.2rem;
  }

  /* ---- Inbox: Work / Personal segmented view (minimal, professional) ---- */
  .inbox-seg {
    position: relative; z-index: 1;
    display: flex; gap: 4px; padding: 4px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
    border-radius: 14px; margin-bottom: 0.9rem;
  }
  .inbox-seg-btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    font-family: inherit; font-size: 0.9rem; font-weight: 700; color: var(--muted);
    background: none; border: none; border-radius: 10px; padding: 0.55rem 0; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .inbox-seg-btn.active { background: rgba(255,255,255,0.10); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .inbox-seg-badge {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 800; color: #fff; background: rgba(255,255,255,0.16);
  }
  .inbox-seg-btn.active .inbox-seg-badge { background: var(--home-accent); }
  .inbox-summary {
    position: relative; z-index: 1;
    font-size: 0.82rem; color: var(--muted); margin: 0 0.2rem 0.7rem;
  }
  .inbox-summary b { color: var(--text); font-weight: 700; }
  .inbox-grouplabel {
    position: relative; z-index: 1;
    font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0.2rem 0 0.4rem;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .inbox-grouplabel.urgent { color: var(--danger); }
  .inbox-empty {
    position: relative; z-index: 1;
    text-align: center; padding: 2.4rem 1rem; color: var(--muted);
  }
  .inbox-empty-ico { font-size: 1.8rem; opacity: 0.7; }
  .inbox-empty-txt { font-size: 0.9rem; margin-top: 0.6rem; line-height: 1.5; }

  /* ---- AI inbox summary card ---- */
  .aisum { position: relative; z-index: 1; padding: 1rem 1.1rem; margin-bottom: 0.9rem; }
  .aisum-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
  .aisum-spark { font-size: 0.95rem; }
  .aisum-title { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); flex: 1; }
  .aisum-refresh { background: none; border: none; color: var(--muted); font-size: 0.95rem; cursor: pointer; padding: 0.1rem 0.3rem; border-radius: 8px; }
  .aisum-refresh:active { background: rgba(255,255,255,0.1); }
  .aisum-overview { font-size: 0.98rem; line-height: 1.5; font-weight: 600; }
  .aisum-loading { display: flex; align-items: center; gap: 0.6rem; color: var(--muted); font-size: 0.9rem; padding: 0.3rem 0; }
  .aisum-spin { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: aisumspin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes aisumspin { to { transform: rotate(360deg); } }
  .aisum-err { font-size: 0.86rem; color: var(--muted); line-height: 1.5; }
  .aisum-sec-label { font-size: 0.64rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 1rem 0 0.5rem; }
  .aisum-hl { padding: 0.6rem 0; border-top: 1px solid rgba(255,255,255,0.08); }
  .aisum-hl:first-of-type { border-top: none; }
  .aisum-hl-top { display: flex; align-items: baseline; gap: 0.5rem; }
  .aisum-hl-from { font-size: 0.82rem; font-weight: 700; color: var(--home-accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aisum-hl-why { font-size: 0.92rem; line-height: 1.4; margin-top: 0.2rem; }
  .aisum-task { display: flex; align-items: center; gap: 0.55rem; margin-top: 0.45rem; }
  .aisum-task-btn {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px;
    background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
    color: var(--text); font-size: 0.95rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .aisum-task-btn.added { background: rgba(52,224,196,0.2); border-color: rgba(52,224,196,0.5); color: var(--ok); }
  .aisum-task-txt { font-size: 0.9rem; line-height: 1.35; }
  .aisum-task-btn.added + .aisum-task-txt { color: var(--muted); text-decoration: line-through; }
  .aisum-ev {
    display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .aisum-ev-date {
    flex-shrink: 0; width: 46px; text-align: center; border-radius: 10px;
    background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); padding: 0.35rem 0;
  }
  .aisum-ev-mon { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--danger); }
  .aisum-ev-day { font-size: 1.15rem; font-weight: 800; line-height: 1.05; }
  .aisum-ev-body { flex: 1; min-width: 0; }
  .aisum-ev-title { font-size: 0.92rem; font-weight: 700; }
  .aisum-ev-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
  .aisum-ev-add {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 0.3rem;
    background: rgba(61,123,255,0.16); border: 1px solid rgba(61,123,255,0.45); color: #a9c9ff;
    font-family: inherit; font-size: 0.76rem; font-weight: 700; padding: 0.4rem 0.7rem;
    border-radius: 999px; text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .aisum-ev-add:active { background: rgba(61,123,255,0.28); }

  button {
    font-family: inherit;
    border: none;
    background: none;
    cursor: pointer;
  }
  .refresh-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 0.9rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    border-radius: 22px;
    background: var(--glass-bg-soft);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .refresh-btn:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.16); }

  @keyframes spin360 { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* Floating pill bottom nav, replaces the old top-right gear/refresh buttons */
  .nd-bottom-nav {
    position: fixed; z-index: 5;
    left: 50%; transform: translateX(-50%);
    bottom: 0;
    display: flex; align-items: center; justify-content: space-around;
    gap: 0.2rem;
    width: min(92vw, 360px);
    /* Flush to the very bottom: the safe-area inset used to sit INSIDE the
       pill as dead space under the icons — trim most of it so the buttons
       land at the true bottom edge, keeping a small floor for tappability. */
    padding: 0.45rem 0.6rem max(calc(env(safe-area-inset-bottom) - 22px), 0.4rem);
    border-radius: 28px 28px 0 0;
    background: rgba(16, 18, 26, 0.72);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  .nd-nav-btn {
    position: relative;
    width: 44px; height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: var(--muted);
    transition: color 0.15s ease, background 0.15s ease;
  }
  .nd-nav-btn svg { width: 22px; height: 22px; }
  .nd-nav-btn.active { color: var(--home-accent); background: rgba(61, 123, 255, 0.14); }
  .nd-nav-btn:active { background: rgba(255, 255, 255, 0.1); }
  .nd-nav-fab {
    width: 56px; height: 56px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: linear-gradient(150deg, #5b9dff, #3D7BFF 60%, #2a5fd9);
    color: #fff;
    box-shadow: 0 6px 18px rgba(61, 123, 255, 0.45);
    transform: translateY(-12px);
    transition: filter 0.15s ease;
  }
  .nd-nav-fab svg { width: 24px; height: 24px; }
  .nd-nav-fab:active { filter: brightness(1.08); }
  .nd-nav-fab.spinning { animation: spin360 0.6s ease; }

  /* Pull-to-refresh spinner */
  .ptr-spinner {
    position: fixed; z-index: 4;
    top: calc(env(safe-area-inset-top) + 0.4rem);
    left: 50%;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; color: var(--text);
    border-radius: 50%;
    background: var(--glass-bg-soft);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    opacity: 0; transform: translate(-50%, -10px);
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .ptr-spinner.active { animation: spin360 0.8s linear infinite; }

  /* ---- Hourly strip ---- */
  .hourly-card { padding: 0.6rem 0.4rem; }
  .hourly-strip {
    position: relative; z-index: 1;
    display: flex; gap: 0.2rem;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .hourly-strip::-webkit-scrollbar { display: none; }
  .hour-cell {
    flex: 0 0 auto; width: 3.5rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
    padding: 0.4rem 0;
  }
  .hc-time { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
  .hc-icon { font-size: 1.25rem; }
  .hc-temp { font-size: 0.95rem; font-weight: 700; }
  .hc-rain { font-size: 0.68rem; color: #5fb0ff; font-weight: 600; min-height: 0.9rem; }

  /* ---- Weather card extras ---- */
  .weather-hilo { font-size: 0.95rem; font-weight: 600; margin-top: 0.35rem; }
  .weather-hilo .hi { color: var(--text); }
  .weather-hilo .lo { color: var(--muted); }
  .weather-sun { color: var(--muted); font-size: 0.82rem; margin-top: 0.25rem; }

  /* ---- Today timeline ---- */
  .timeline-row {
    position: relative; z-index: 1;
    display: flex; align-items: flex-start; gap: 0.65rem;
    padding: 0.6rem 0.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    text-decoration: none; color: var(--text);
  }
  .timeline-row:last-child { border-bottom: none; }
  a.timeline-row:active { background: rgba(255,255,255,0.08); }
  .tl-icon { flex-shrink: 0; font-size: 1.1rem; width: 1.5rem; text-align: center; }
  .tl-body { flex: 1; min-width: 0; }
  .tl-title { font-weight: 600; font-size: 0.95rem; }
  .tl-meta { color: var(--muted); font-size: 0.8rem; margin-top: 0.1rem; }
  .tl-time { flex-shrink: 0; font-size: 0.82rem; font-weight: 600; color: var(--muted); white-space: nowrap; margin-top: 0.1rem; }

  /* ---- Time-of-day theming: subtle cool shifts on the same near-black base ---- */
  body.theme-dawn  { background: linear-gradient(168deg, #0e1528 0%, #0c0a18 60%, #07080B 100%); }
  body.theme-day   { background: linear-gradient(168deg, #0c1020 0%, #0a0b12 55%, #0a080f 100%); }
  body.theme-dusk  { background: linear-gradient(168deg, #160e22 0%, #100a14 60%, #07080B 100%); }
  body.theme-night { background: linear-gradient(168deg, #0a0e18 0%, #07090e 60%, #050608 100%); }
  body.theme-night .blob { opacity: 0.44; }

  /* ---- Drill-in affordance + detail screens ---- */
  .card-drill {
    position: absolute; top: 0.7rem; right: 0.7rem; z-index: 2;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; color: var(--text);
    border-radius: 50%;
    background: rgba(0,0,0,0.16);
    border: 1px solid rgba(0,0,0,0.12);
  }
  .card-drill:active { background: rgba(0,0,0,0.28); }
  .header-drill {
    display: inline-flex; align-items: center; gap: 0.25rem;
    font-size: 0.74rem; font-weight: 700; color: var(--accent);
    background: rgba(255,178,46,0.18);
    border: 1px solid rgba(255,178,46,0.38);
    border-radius: 999px; padding: 0.2rem 0.6rem;
  }
  .header-drill:active { background: rgba(255,178,46,0.32); }

  .detail-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(6,9,18,0.86);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 0.8rem) 1.1rem calc(env(safe-area-inset-bottom) + 2rem);
    display: flex; flex-direction: column; gap: 1rem;
    animation: detailIn 0.22s ease;
  }
  .detail-overlay[hidden] { display: none; }
  @keyframes detailIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .detail-header { display: flex; align-items: center; gap: 0.8rem; }
  .detail-back {
    width: 40px; height: 40px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; color: var(--text);
    border-radius: 50%; background: var(--glass-bg-soft);
    border: 1px solid var(--glass-border);
  }
  .detail-back:active { background: rgba(255,255,255,0.16); }
  .detail-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; }

  /* ---- Full-screen debrief page: solid background (no blur-through to home),
     horizontal push transition — reads as a new page, not an overlay sheet. ---- */
  .debrief-page {
    position: fixed; inset: 0; z-index: 60;
    background: linear-gradient(168deg, #2a1d13 0%, #1c130c 55%, #130d08 100%);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 0.8rem) 1.1rem calc(env(safe-area-inset-bottom) + 2rem);
    display: flex; flex-direction: column; gap: 1rem;
    animation: debriefIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .debrief-page[hidden] { display: none; }
  .debrief-page.closing { animation: debriefOut 0.22s ease forwards; }
  @keyframes debriefIn { from { opacity: 0.5; transform: translateX(32px); } to { opacity: 1; transform: none; } }
  @keyframes debriefOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(32px); } }
  .debrief-refresh-btn { margin-left: auto; }

  .debrief-section { padding: 1rem 1.1rem; cursor: pointer; }
  .debrief-section-head { display: flex; align-items: center; gap: 0.6rem; }
  .debrief-section-title { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); flex: 1; }
  .debrief-section-chev { color: var(--muted); font-size: 1.1rem; transition: transform 0.2s ease; flex-shrink: 0; }
  .debrief-section.expanded .debrief-section-chev { transform: rotate(90deg); }
  .debrief-section-summary { font-size: 1.02rem; font-weight: 600; line-height: 1.45; margin-top: 0.45rem; }
  /* Grid-rows 0fr->1fr trick: animates height without measuring it in JS. */
  .debrief-section-detail {
    font-size: 0.92rem; color: var(--muted); line-height: 1.55;
    display: grid; grid-template-rows: 0fr; opacity: 0; margin-top: 0;
    transition: grid-template-rows 0.3s ease, opacity 0.25s ease, margin-top 0.3s ease;
  }
  .debrief-section-detail > div { overflow: hidden; min-height: 0; }
  .debrief-section-detail .brief-h3 { color: var(--accent); opacity: 0.85; }
  .debrief-section.expanded .debrief-section-detail { grid-template-rows: 1fr; opacity: 1; margin-top: 0.75rem; }
  .debrief-tomorrow .debrief-section-title { color: #7dd8ff; }

  /* Tappable brief actions: one-tap "add to today's checklist" rows. */
  .brief-items { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.7rem; }
  .brief-item {
    display: flex; align-items: center; gap: 0.6rem; width: 100%; text-align: left;
    background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
    color: var(--text); font-family: inherit; font-size: 0.9rem; font-weight: 600;
    padding: 0.55rem 0.7rem; border-radius: 12px; cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
  }
  .brief-item:active { background: rgba(255,255,255,0.09); }
  .brief-item-ico {
    flex: 0 0 auto; width: 1.4rem; height: 1.4rem; border-radius: 50%;
    display: grid; place-items: center; font-size: 0.9rem; font-weight: 800;
    background: rgba(255,178,46,0.16); color: var(--accent);
  }
  .brief-item-txt { flex: 1 1 auto; line-height: 1.35; }
  .brief-item.added { opacity: 0.6; cursor: default; border-color: rgba(255,178,46,0.35); }
  .brief-item.added .brief-item-ico { background: rgba(255,178,46,0.28); }

  /* Plan-progress bar at the top of the brief: N of M brief tasks done today. */
  .brief-adherence { margin: 0.2rem 0 1rem; }
  .brief-adherence-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.4rem; }
  .brief-adherence-top b { color: var(--text); font-weight: 700; }
  .brief-adherence-bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .brief-adherence-bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.3s ease; }

  .detail-hero { padding: 1.2rem 1.2rem; }
  .metric-big { font-size: 3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .metric-sub { color: var(--muted); font-size: 0.92rem; margin-top: 0.35rem; }
  .metric-row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.8rem; }
  .metric-chip {
    background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
    border-radius: 14px; padding: 0.5rem 0.7rem; flex: 1; min-width: 5.5rem;
  }
  .metric-chip .k { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
  .metric-chip .v { font-size: 1.15rem; font-weight: 700; margin-top: 0.15rem; }

  .insight-card { padding: 1rem 1.1rem; }
  .insight-head {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin-bottom: 0.6rem;
  }
  .insight-line {
    position: relative; z-index: 1;
    display: flex; gap: 0.55rem; align-items: flex-start;
    font-size: 0.95rem; line-height: 1.4; padding: 0.32rem 0;
  }
  .insight-line .ico { flex-shrink: 0; }

  /* Horizontal labelled bar chart (free-time blocks, top senders, etc.) */
  .bars { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.2rem; }
  .bar-row { display: grid; grid-template-columns: 4.5rem 1fr auto; align-items: center; gap: 0.5rem; }
  .bar-row .bl { font-size: 0.82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { height: 8px; border-radius: 5px; background: rgba(255,255,255,0.10); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #ff9d4d, #ffc24d); }
  .bar-row .bv { font-size: 0.82rem; font-weight: 700; white-space: nowrap; }

  /* ---- Brief / review CTA on the home hero card ---- */
  .brief-cta {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 0.7rem; width: 100%;
    background: transparent; border: none; padding: 0.15rem 0; text-align: left; color: var(--text);
  }
  .brief-emoji { font-size: 1.5rem; flex-shrink: 0; }
  .brief-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .brief-text b { font-size: 1rem; font-weight: 700; line-height: 1.25; }
  .brief-sub { color: var(--muted); font-size: 0.8rem; margin-top: 0.1rem; }
  .brief-arrow { flex-shrink: 0; color: var(--accent); font-size: 1.2rem; font-weight: 700; }

  /* ---- Brief section (rendered markdown) ---- */
  .brief-card { line-height: 1.5; }
  .brief-h { font-size: 1.25rem; font-weight: 800; margin: 0 0 0.6rem; letter-spacing: -0.01em; }
  .brief-h3 { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); margin: 1.1rem 0 0.35rem; }
  .brief-h3:first-of-type { margin-top: 0.7rem; }
  .brief-p { margin: 0.5rem 0; font-size: 0.95rem; line-height: 1.5; }
  .brief-ul { margin: 0.4rem 0; padding-left: 1.1rem; }
  .brief-ul li { margin: 0.3rem 0; font-size: 0.95rem; }
  .brief-actions { text-align: center; padding: 0.2rem 0; }
  .push-status { text-align: center; color: var(--muted); font-size: 0.85rem; font-weight: 600; padding: 0.3rem 0; }
  .brief-refresh {
    font-size: 0.85rem; font-weight: 700; color: var(--accent);
    background: rgba(255,178,46,0.16); border: 1px solid rgba(255,178,46,0.36);
    border-radius: 999px; padding: 0.5rem 1.1rem;
  }
  .brief-refresh:active { background: rgba(255,178,46,0.3); }

  /* ---- Two-way task controls ---- */
  .task-add {
    display: block; width: 100%; text-align: left;
    font-size: 0.9rem; font-weight: 700; color: var(--accent);
    background: rgba(255,178,46,0.12); border: 1px dashed rgba(255,178,46,0.45);
    border-radius: 14px; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem;
  }
  .task-add:active { background: rgba(255,178,46,0.24); }
  .task-input-row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
  .task-text-input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 0.95rem;
    color: var(--text); background: rgba(0,0,0,0.06);
    border: 1px solid var(--glass-border); border-radius: 12px; padding: 0.6rem 0.7rem;
  }
  .task-text-input::placeholder { color: var(--muted); }
  .task-add-btn {
    flex-shrink: 0; font-size: 0.9rem; font-weight: 800; color: #3a2710;
    background: var(--accent); border-radius: 12px; padding: 0.6rem 1rem;
  }
  .task-add-btn:active { filter: brightness(0.95); }
  .app-task .task-box { cursor: pointer; transition: background 0.12s ease; }
  .task-box.checked { background: var(--ok); border-color: var(--ok); position: relative; }
  .task-box.checked::after { content: "✓"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 800; color: #06231d; }
  .task-done .task-title { text-decoration: line-through; opacity: 0.55; }
  .task-mini { margin-left: 0.2rem; width: 24px; height: 24px; flex-shrink: 0; border-radius: 8px; background: rgba(0,0,0,0.08); color: var(--muted); font-size: 0.95rem; font-weight: 700; }
  .task-done-head { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0.7rem 0 0.2rem; }
  .review-note {
    width: 100%; min-height: 64px; resize: vertical; box-sizing: border-box;
    border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.10);
    color: var(--text); font-family: inherit; font-size: 0.92rem; padding: 0.6rem 0.7rem; margin-top: 0.2rem;
  }

  /* ---- Streak chip in header ---- */
  .welcome-meta { display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap; margin-top: 0.45rem; }
  .welcome-meta .updated-label { margin-top: 0; }
  .streak-chip {
    font-size: 0.74rem; font-weight: 800; color: #ffcaa0;
    background: rgba(255,126,60,0.18); border: 1px solid rgba(255,126,60,0.4);
    border-radius: 999px; padding: 0.1rem 0.55rem;
  }

  /* ---- AI overview ---- */
  .overview-card { padding: 1rem 1.1rem; }
  .overview-label {
    position: relative; z-index: 1;
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.5rem;
  }
  .overview-line {
    position: relative; z-index: 1;
    display: flex; align-items: flex-start; gap: 0.5rem;
    font-size: 0.92rem; line-height: 1.35; padding: 0.3rem 0;
  }
  .overview-line .icon { flex-shrink: 0; }

  /* ===================== New homepage (native-app tiles) ===================== */
  main.home {
    gap: 0.5rem;
    min-height: calc(100dvh - env(safe-area-inset-top) - 0.3rem);
    display: flex; flex-direction: column; padding-bottom: 5.2rem;
  }

  .nd-greet { padding: 0 0.3rem; }
  .nd-greet-row { display: flex; align-items: center; gap: 0.7rem; }
  .nd-avatar {
    width: 2.6rem; height: 2.6rem; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; font-weight: 800; color: #fff;
    background: linear-gradient(150deg, #5b9dff, #3D7BFF 60%, #2a5fd9);
    box-shadow: 0 4px 14px rgba(61,123,255,0.35);
  }
  .nd-greet-line { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.06; margin: 0; }
  .nd-greet-line .accent { color: var(--home-accent); }
  .nd-greet-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.3rem; flex-wrap: wrap; }
  .nd-greet-date { color: var(--muted); font-size: 0.84rem; font-weight: 600; }
  /* Compact weather + recovery chips on the meta row (full views one tap away) */
  .nd-chip { display: inline-flex; align-items: center; gap: 0.3rem; background: rgba(255,255,255,0.07); border: 1px solid var(--glass-border); border-radius: 999px; padding: 0.16rem 0.6rem; font-size: 0.76rem; font-weight: 600; color: var(--text); cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .nd-chip b { font-weight: 800; }
  .nd-chip svg { width: 1.1rem; height: 0.95rem; flex-shrink: 0; }
  .nd-chip-txt { color: var(--muted); max-width: 7.5rem; overflow: hidden; text-overflow: ellipsis; }
  .nd-chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .nd-day-strip { display: flex; justify-content: space-between; gap: 0.35rem; padding: 0 0.1rem; }
  .nd-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.4rem 0; border-radius: 14px; }
  .nd-day-dow { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.7; }
  .nd-day-num { font-size: 0.92rem; font-weight: 800; }
  .nd-day.inert { opacity: 0.5; }
  .nd-day.active { background: var(--home-accent); color: #fff; box-shadow: 0 4px 14px rgba(61,123,255,0.35); }

  .nd-hero-wrap { position: relative; }
  .nd-hero-glow {
    position: absolute; inset: -24px; pointer-events: none; filter: blur(40px); opacity: 0.85;
    background:
      radial-gradient(50% 60% at 12% 0%, rgba(70,130,255,0.80), transparent 70%),
      radial-gradient(45% 60% at 85% 10%, rgba(195,55,230,0.65), transparent 70%),
      radial-gradient(55% 70% at 70% 100%, rgba(255,110,50,0.50), transparent 70%);
  }
  .nd-hero { background: linear-gradient(130deg, rgba(28,52,170,0.42) 0%, rgba(82,22,140,0.30) 55%, rgba(130,28,78,0.18) 100%); border: 1px solid rgba(100,148,255,0.28); border-radius: 22px; padding: 1.1rem 1.15rem; min-height: 8rem; position: relative; z-index: 1; overflow: hidden; }
  .nd-hero::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(var(--home-accent), rgba(61,123,255,0.25)); }
  .nd-hero-label { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--home-accent); }
  .nd-hero-headline { font-size: 1.3rem; font-weight: 800; line-height: 1.16; letter-spacing: -0.01em; margin-top: 0.35rem; }
  .nd-hero-preview { font-size: 0.88rem; color: var(--muted); line-height: 1.35; margin-top: 0.35rem; }
  .nd-hero-cta { display: inline-flex; align-items: center; gap: 0.3rem; margin-top: 0.55rem; font-size: 0.88rem; font-weight: 700; color: var(--home-accent); cursor: pointer; }
  .nd-hero-plan { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.5rem; font-size: 0.8rem; font-weight: 700; color: var(--text); }
  .nd-hero-plan-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: rgba(255,178,46,0.5); box-shadow: 0 0 0 3px rgba(255,178,46,0.12); }
  .nd-hero-plan-dot.full { background: var(--accent); box-shadow: 0 0 0 3px rgba(255,178,46,0.22); }
  .nd-hero { cursor: pointer; }
  .nd-hero-glance { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem 0.7rem; margin-top: 0.65rem; }
  .nd-glance-item { display: flex; flex-direction: column; gap: 0.1rem; }
  .nd-glance-val { font-size: 1.1rem; font-weight: 800; line-height: 1.1; }
  .nd-glance-lbl { font-size: 0.67rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }

  .debrief-day-hdr { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--home-accent); margin: 1rem 0 0.35rem; padding: 0 0.25rem; }
  .db-ev-row { display: flex; align-items: flex-start; gap: 0.55rem; padding: 0.42rem 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .db-ev-row:last-child { border-bottom: none; }
  .db-ev-time { font-size: 0.75rem; font-weight: 700; color: var(--home-accent); min-width: 3.2rem; padding-top: 0.05rem; flex-shrink: 0; }
  .db-ev-title { font-size: 0.88rem; line-height: 1.3; }
  .db-health-row { display: flex; gap: 0.6rem; margin-top: 0.15rem; }
  .db-health-stat { flex: 1; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 0.55rem 0.35rem; text-align: center; }
  .db-health-val { font-size: 1.2rem; font-weight: 800; }
  .db-health-lbl { font-size: 0.64rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 0.1rem; }
  .db-email-row { display: flex; align-items: baseline; gap: 0.6rem; padding: 0.42rem 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .db-email-row:last-child { border-bottom: none; }
  .db-email-from { font-size: 0.82rem; font-weight: 700; flex-shrink: 0; max-width: 42%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .db-email-subj { font-size: 0.82rem; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; min-width: 0; }

  .nd-readiness { display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 20px; padding: 0.5rem 0.6rem; cursor: pointer; }
  .nd-recov-wrap { position: relative; width: 4.8rem; height: 4.8rem; flex-shrink: 0; }
  .nd-recov-wrap svg { width: 100%; height: 100%; display: block; }
  .nd-recov-val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
  .nd-recov-body { flex: 1; min-width: 0; }
  .nd-recov-title { display: flex; align-items: center; gap: 0.5rem; }
  .nd-recov-title b { font-size: 1rem; font-weight: 800; }
  .nd-tag { font-size: 0.64rem; font-weight: 600; color: var(--muted); background: rgba(255,255,255,0.07); border: 1px solid var(--glass-border); border-radius: 999px; padding: 0.1rem 0.5rem; }
  .nd-trend { font-size: 0.66rem; font-weight: 800; border-radius: 999px; padding: 0.08rem 0.42rem; letter-spacing: 0.01em; }
  .nd-trend.up { color: #5fd39b; background: rgba(70,201,139,0.16); }
  .nd-trend.down { color: #ff9a9a; background: rgba(255,107,107,0.16); }
  .recov-chart { display: flex; gap: 0.4rem; align-items: flex-end; margin: 0.3rem 0 1.1rem; padding: 0 0.1rem; }
  .recov-chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
  .recov-chart .bar { width: 100%; height: 70px; background: rgba(255,255,255,0.07); border-radius: 5px; display: flex; align-items: flex-end; overflow: hidden; }
  .recov-chart .fill { width: 100%; background: linear-gradient(#aee63b, #27b24a); }
  .recov-chart .d { font-size: 0.6rem; color: var(--muted); }
  .recov-chart .v { font-size: 0.64rem; font-weight: 700; }
  .nd-recov-sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; }
  .nd-rtrack { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 16; }
  .nd-chev { margin-left: auto; color: var(--muted); opacity: 0.55; flex-shrink: 0; align-self: center; }

  .nd-readiness-triad { display: flex; flex-direction: column; gap: 0.4rem; width: 100%; }
  .nd-readiness-triad-head { display: flex; align-items: center; gap: 0.5rem; }
  .nd-readiness-triad-head b { font-size: 0.92rem; font-weight: 800; }
  .nd-mini-rings { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.3rem; }
  .mring { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
  .mring-wrap { position: relative; width: 2.7rem; height: 2.7rem; }
  .mring-wrap svg { width: 100%; height: 100%; display: block; }
  .mring-val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
  .mring-val.empty { color: var(--muted); font-weight: 700; }
  .mring-label { font-size: 0.6rem; font-weight: 700; color: var(--muted); }

  .nd-wx { border-radius: 20px; padding: 0.7rem 0.9rem; color: #fff; background: linear-gradient(165deg, #2f3b52, #232b3d 55%, #1a2030); box-shadow: 0 10px 26px rgba(0,0,0,0.3); cursor: pointer; }
  .nd-wx-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .nd-wx-loc { font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 0.25rem; }
  .nd-wx-temp { font-size: 2.1rem; font-weight: 300; line-height: 1; margin-top: 0.1rem; letter-spacing: -0.02em; }
  .nd-wx-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.1rem; }
  .nd-wx-right > svg { width: 1.9rem; height: 1.5rem; display: block; margin-bottom: 0.1rem; }
  .nd-wx-cond { font-size: 0.85rem; font-weight: 700; }
  .nd-wx-hl { font-size: 0.74rem; font-weight: 700; color: #e7ebef; }
  .nd-wx-hours { display: none; }
  .nd-wx-hour { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; flex: 1; }
  .nd-wx-hour .t { font-size: 0.72rem; color: #cfd6dd; font-weight: 600; }
  .nd-wx-hour .v { font-size: 0.9rem; font-weight: 700; }
  .nd-wx-hour svg { width: 1.7rem; height: 1.45rem; display: block; }
  .nd-wx-msg { font-size: 0.85rem; color: #cfd6dd; margin-top: 0.2rem; }

  /* Lower split: weather+calendar on the left, readiness+inbox on the right,
     both columns spanning from below the AI brief down to the bottom nav. */
  .nd-split { display: flex; gap: 0.6rem; flex: 1 1 auto; min-height: 0; }
  .nd-split-col { display: flex; flex-direction: column; gap: 0.6rem; flex: 1 1 50%; min-width: 0; min-height: 0; }
  .nd-split-col .nd-wx, .nd-split-col .nd-readiness { flex-shrink: 0; }

  .nd-cal {
    background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 20px;
    padding: 0.65rem 0.75rem; cursor: pointer;
    display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  }
  .nd-cal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.4rem; flex-shrink: 0; }
  .nd-cal-top b { font-size: 0.84rem; font-weight: 700; }
  .nd-cal-top span { font-size: 0.7rem; color: var(--muted); }
  .nd-cal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; margin-top: 0.3rem; }
  .nd-cal-empty { font-size: 0.78rem; color: var(--muted); margin-top: 0.55rem; }

  .nd-ol { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .nd-ol-head { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.7rem; background: linear-gradient(180deg, rgba(43,111,214,0.18), transparent); flex-shrink: 0; }
  .nd-ol-rows { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .nd-ol-logo { width: 1.4rem; height: 1.4rem; border-radius: 0.36rem; background: #2b6fd6; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .nd-ol-title { font-size: 0.84rem; font-weight: 700; }
