// ---------- Readiness (Recovery, from Athlytic via the iOS Shortcut) ----------
const HEALTH_CACHE_KEY = 'morningDewHealth';
const RING_R = 82;
const RING_C = 2 * Math.PI * RING_R; // ~515.2

// One progress ring. pct 0–100; grad is a <linearGradient> id. Starts at 12
// o'clock and sweeps clockwise.
function ringSvg(pct, grad) {
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  const arc = (p / 100) * RING_C;
  return `<svg viewBox="0 0 200 200">
    <circle class="nd-rtrack" cx="100" cy="100" r="${RING_R}"/>
    <circle cx="100" cy="100" r="${RING_R}" fill="none" stroke="url(#${grad})" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="${arc.toFixed(1)} ${RING_C.toFixed(1)}" transform="rotate(-90 100 100)"/>
  </svg>`;
}

function recoveryWord(r) {
  if (r >= 67) return 'Primed — a good day to push';
  if (r >= 34) return 'Moderate — pace yourself';
  return 'Low — take it easy today';
}
function sleepWord(s) {
  if (s >= 75) return 'Well rested';
  if (s >= 40) return 'Adequate sleep';
  return 'Short on sleep';
}
function strainWord(s) {
  if (s >= 67) return 'High exertion';
  if (s >= 34) return 'Moderate activity';
  return 'Light day';
}
// Today's recommended exertion ceiling/floor based on current recovery — same
// idea as Whoop's Strain Coach: a well-recovered body can absorb a harder day,
// a depleted one should stay light. A function of recovery alone (not today's
// strain itself) so it always answers "what should I do today", independent
// of what's already accumulated.
function targetStrainRange(rec) {
  if (rec == null) return null;
  const mid = 20 + (rec / 100) * 55; // 20 at recovery 0 .. 75 at recovery 100
  return { lo: Math.max(1, Math.round(mid - 12)), hi: Math.min(99, Math.round(mid + 12)) };
}
function targetStrainCompare(actual, t) {
  if (actual == null || !t) return 'Aim to land in this range today.';
  if (actual > t.hi) return `Today's strain is above target — you pushed harder than your recovery suggested.`;
  if (actual < t.lo) return `Today's strain is below target — there's room for more if you want it.`;
  return `Right in your target range — well matched to today's recovery.`;
}
// Diagonal-hatched arc spanning the target lo–hi zone, drawn at the SAME
// radius as the main ring and placed UNDER it (see detailRingHtml), so the
// solid progress arc naturally paints over the hatch wherever strain has
// already reached into the target band. Matches the Whoop/Athlytic Strain
// Coach ring: solid = achieved, hatch = the zone still worth reaching for.
function targetBandSvg(t) {
  if (!t) return '';
  const lo = Math.max(0, Math.min(100, t.lo));
  const hi = Math.max(0, Math.min(100, t.hi));
  const arcLen = ((hi - lo) / 100) * RING_C;
  const offset = -(lo / 100) * RING_C;
  return `<svg viewBox="0 0 200 200" style="position:absolute;inset:0;pointer-events:none">
    <circle cx="100" cy="100" r="${RING_R}" fill="none" stroke="url(#targetHatch)" stroke-width="16"
      stroke-dasharray="${arcLen.toFixed(1)} ${(RING_C - arcLen).toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      transform="rotate(-90 100 100)"/>
  </svg>`;
}
// Small white tick marks at the target zone's lo/hi boundaries, drawn on top
// of everything so the zone's edges stay readable even where the solid arc
// or hatch underneath it changes.
function targetTicksSvg(t) {
  if (!t) return '';
  const tick = (pct) => {
    const a = (pct / 100) * 2 * Math.PI;
    const x1 = 100 + (RING_R - 10) * Math.sin(a);
    const y1 = 100 - (RING_R - 10) * Math.cos(a);
    const x2 = 100 + (RING_R + 10) * Math.sin(a);
    const y2 = 100 - (RING_R + 10) * Math.cos(a);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`;
  };
  return `<svg viewBox="0 0 200 200" style="position:absolute;inset:0;pointer-events:none">${tick(t.lo)}${tick(t.hi)}</svg>`;
}

// One mini progress ring for the home card's 3-up row. val null -> empty muted
// track with "–" so one missing/uncalibrated metric never blocks the others.
// Optional underlay/overlay mirror detailRingHtml's so the home Strain ring can
// show the same target-zone hatch/ticks as the detail screen, just smaller.
function miniRingHtml(val, grad, label, underlay = '', overlay = '') {
  const ring = val == null
    ? `<svg viewBox="0 0 200 200"><circle class="nd-rtrack" cx="100" cy="100" r="${RING_R}"/></svg><span class="mring-val empty">–</span>`
    : `${ringSvg(val, grad)}<span class="mring-val">${val}%</span>`;
  return `<div class="mring"><div class="mring-wrap">${underlay}${ring}${overlay}</div><span class="mring-label">${label}</span></div>`;
}
// Same as miniRingHtml but sized for the detail screen's larger .health-detail-rings grid.
// Optional underlay (e.g. targetBandSvg) renders absolutely-positioned BEHIND the ring so
// the solid progress arc paints over it; overlay (e.g. targetTicksSvg) renders on top.
function detailRingHtml(val, grad, label, underlay = '', overlay = '') {
  const ring = val == null
    ? `<svg viewBox="0 0 200 200"><circle class="nd-rtrack" cx="100" cy="100" r="${RING_R}"/></svg><span class="hring-val" style="color:var(--muted)">–</span>`
    : `${ringSvg(val, grad)}<span class="hring-val">${val}%</span>`;
  return `<div class="hring"><div class="hring-wrap">${underlay}${ring}${overlay}</div><span class="hring-label">${label}</span></div>`;
}

// On-device recovery history (date -> score) so the card and the brief can show a
// trend, even though the server only keeps the latest snapshot. Keyed by local
// date; today's value is overwritten with the latest, capped at 60 days.
const HEALTH_HIST_KEY = 'morningDewHealthHist';
// Each day's entry used to be a bare recovery number; it's now an object
// ({ rec, sleepHours, strain }) so the sleep-recommendation engine can see
// recent nights' sleep duration too. Both shapes are read transparently —
// existing on-device history from before this change still works.
function recordHealthHistory(h) {
  if (!h) return;
  const hist = lsGet(HEALTH_HIST_KEY, {});
  const date = localDateStr(new Date());
  const prev = hist[date];
  const entry = (prev && typeof prev === 'object') ? Object.assign({}, prev) : (typeof prev === 'number' ? { rec: prev } : {});
  if (h.recovery != null && Number.isFinite(Number(h.recovery))) entry.rec = Math.round(Number(h.recovery));
  if (h.sleepHours != null && Number.isFinite(Number(h.sleepHours))) entry.sleepHours = Number(h.sleepHours);
  if (h.strain != null && Number.isFinite(Number(h.strain))) entry.strain = Number(h.strain);
  hist[date] = entry;
  // 60-day retention so the Trends 60-day range has real data to show.
  for (const d of Object.keys(hist).sort().slice(0, -60)) delete hist[d];
  lsSet(HEALTH_HIST_KEY, hist);
}
function recoveryHistory() {
  const hist = lsGet(HEALTH_HIST_KEY, {});
  return Object.keys(hist).sort().reverse()
    .map((d) => ({ date: d, score: typeof hist[d] === 'number' ? hist[d] : hist[d].rec }))
    .filter((e) => e.score != null);
}
function sleepHistory() {
  const hist = lsGet(HEALTH_HIST_KEY, {});
  return Object.keys(hist).sort().reverse()
    .map((d) => ({ date: d, hours: (hist[d] && typeof hist[d] === 'object') ? hist[d].sleepHours : null }))
    .filter((e) => e.hours != null);
}
function recoveryTrend() {
  const h = recoveryHistory();
  if (h.length < 2) return null;
  return { delta: h[0].score - h[1].score, previousScore: h[1].score, previousDate: h[1].date };
}
function trendChip(t) {
  if (!t || t.delta === 0) return '';
  return t.delta > 0 ? `▲${t.delta}` : `▼${Math.abs(t.delta)}`;
}

// ========== Accuracy layer: outcome log + pattern memory + calibration ==========
// This is structured memory and a feedback loop around the AI outputs, not the
// model itself getting smarter: each brief is logged with the data it was built
// from, next-day actuals get attached when they arrive, personal patterns are
// derived from the accumulated history, and all of it is fed back into the next
// generation as context — so outputs get calibrated to real logged trends
// instead of generic heuristics. Everything lives on-device and is inspectable
// from the "Why this brief" panel on the debrief page.
const MD_INSIGHT_KEY = 'morningDewInsightLog';
const MD_PATTERNS_KEY = 'morningDewPatterns';

function insightLog() { const v = lsGet(MD_INSIGHT_KEY, []); return Array.isArray(v) ? v : []; }

// Chronological day-records from the on-device health history (newest last),
// tolerating the legacy bare-number entry shape.
function healthHistEntries() {
  const hist = lsGet(HEALTH_HIST_KEY, {});
  return Object.keys(hist).sort().map((d) => {
    const v = hist[d];
    return typeof v === 'number'
      ? { date: d, rec: v, sleepHours: null, strain: null }
      : { date: d, rec: v.rec ?? null, sleepHours: v.sleepHours ?? null, strain: v.strain ?? null };
  });
}
function nextDayStr(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + 1);
  return localDateStr(d);
}

// Snapshot what the brief predicted and exactly what it was built from.
// One entry per day; regenerating replaces that day's entry. Capped at 60.
function recordBriefInsight(ctx, brief) {
  try {
    const structured = brief && typeof brief === 'object' && Array.isArray(brief.sections);
    const entry = {
      date: localDateStr(new Date()),
      ts: Date.now(),
      kind: 'brief',
      predicted: {
        headline: structured ? (brief.headline || '') : String(brief).slice(0, 100),
        recBand: ctx.recovery ? ctx.recovery.band : null,
        targetStrain: ctx.targetStrain || null,
      },
      inputs: {
        recovery: ctx.recovery ? ctx.recovery.score : null,
        sleepHours: ctx.recovery ? ctx.recovery.sleepHours : null,
        strain: ctx.strain ? ctx.strain.score : null,
        events: (ctx.events || []).length,
        personal: ctx.personal || null,
        basis: structured && Array.isArray(brief.basis) ? brief.basis.slice(0, 8) : null,
      },
      outcome: null,
      feedback: null,
    };
    const log = insightLog().filter((e) => !(e.date === entry.date && e.kind === 'brief'));
    log.push(entry);
    while (log.length > 60) log.shift();
    lsSet(MD_INSIGHT_KEY, log);
  } catch (err) { mdLog('warn', 'accuracy', `insight record failed: ${err && err.message}`); }
}

// Attach what ACTUALLY happened: when health data lands for the day after a
// logged brief, store next-day recovery/sleep against that brief's entry.
function backfillOutcomes() {
  try {
    const log = insightLog();
    const byDate = {};
    healthHistEntries().forEach((e) => { byDate[e.date] = e; });
    let changed = false;
    for (const entry of log) {
      if (entry.outcome) continue;
      const next = byDate[nextDayStr(entry.date)];
      if (!next || next.rec == null) continue;
      const planItems = briefTasksForDate(entry.date);
      entry.outcome = {
        filledAt: Date.now(),
        nextRecovery: next.rec,
        nextSleepHours: next.sleepHours,
        recDelta: entry.inputs && entry.inputs.recovery != null ? next.rec - entry.inputs.recovery : null,
        // Plan adherence: how many of that day's brief-suggested tasks the user
        // actually completed — the "planned vs. did" signal for calibration.
        planItems: planItems.length,
        planDone: planItems.filter((t) => t.done).length,
      };
      changed = true;
    }
    if (changed) lsSet(MD_INSIGHT_KEY, log);
  } catch (err) { mdLog('warn', 'accuracy', `outcome backfill failed: ${err && err.message}`); }
}

function mdConfidence(n) { return n >= 8 ? 'high' : n >= 4 ? 'medium' : 'low'; }

// Derive personal patterns from accumulated day-pairs (day D -> day D+1).
// Pure aggregation over logged data — no assumptions injected.
function recomputePatterns() {
  try {
    const entries = healthHistEntries();
    const byDate = {};
    entries.forEach((e) => { byDate[e.date] = e; });
    const pairs = entries
      .map((e) => ({ day: e, next: byDate[nextDayStr(e.date)] }))
      .filter((p) => p.next && p.day.rec != null && p.next.rec != null);
    const patterns = [];
    const avgDelta = (subset) => subset.reduce((s, p) => s + (p.next.rec - p.day.rec), 0) / subset.length;
    const fmt = (v) => `${v >= 0 ? '+' : ''}${Math.round(v)}`;
    const short = pairs.filter((p) => p.day.sleepHours != null && p.day.sleepHours < 7);
    if (short.length >= 2) patterns.push({ key: 'short-sleep', n: short.length, confidence: mdConfidence(short.length),
      statement: `After nights under 7h of sleep, next-day recovery moves ${fmt(avgDelta(short))} on average (${short.length} nights logged)` });
    const good = pairs.filter((p) => p.day.sleepHours != null && p.day.sleepHours >= 7.5);
    if (good.length >= 2) patterns.push({ key: 'good-sleep', n: good.length, confidence: mdConfidence(good.length),
      statement: `After nights of 7.5h+ sleep, next-day recovery moves ${fmt(avgDelta(good))} on average (${good.length} nights logged)` });
    const hard = pairs.filter((p) => p.day.strain != null && p.day.strain >= 67);
    if (hard.length >= 2) patterns.push({ key: 'high-strain', n: hard.length, confidence: mdConfidence(hard.length),
      statement: `After high-strain days (67+), next-day recovery moves ${fmt(avgDelta(hard))} on average (${hard.length} days logged)` });
    const recent = entries.slice(-7).filter((e) => e.rec != null);
    if (recent.length >= 3) {
      const avgRec = Math.round(recent.reduce((s, e) => s + e.rec, 0) / recent.length);
      const slept = recent.filter((e) => e.sleepHours != null);
      const avgSleep = slept.length ? Math.round(slept.reduce((s, e) => s + e.sleepHours, 0) / slept.length * 10) / 10 : null;
      patterns.push({ key: 'baseline-7d', n: recent.length, confidence: mdConfidence(recent.length),
        statement: `7-day baseline: recovery averages ${avgRec}${avgSleep != null ? `, sleep averages ${avgSleep}h` : ''} (${recent.length} days logged)` });
    }
    lsSet(MD_PATTERNS_KEY, { computedAt: Date.now(), patterns });
  } catch (err) { mdLog('warn', 'accuracy', `pattern recompute failed: ${err && err.message}`); }
}
function storedPatterns() { const v = lsGet(MD_PATTERNS_KEY, null); return (v && Array.isArray(v.patterns)) ? v.patterns : []; }

// The calibration block handed to the brief generator: personal patterns,
// how recent reads matched next-day actuals, and any explicit corrections.
function personalContext() {
  const withOutcome = insightLog().filter((e) => e.outcome).slice(-5);
  const accuracy = withOutcome.map((e) => ({
    date: e.date,
    briefReadRecoveryAs: e.predicted ? e.predicted.recBand : null,
    recoveryThatDay: e.inputs ? e.inputs.recovery : null,
    nextDayRecovery: e.outcome.nextRecovery,
    changeByNextDay: e.outcome.recDelta,
    planItemsSuggested: (e.outcome.planItems != null) ? e.outcome.planItems : null,
    planItemsCompleted: (e.outcome.planDone != null) ? e.outcome.planDone : null,
    userFeedback: e.feedback ? `${e.feedback.rating}${e.feedback.note ? ': ' + e.feedback.note : ''}` : null,
  }));
  const corrections = insightLog()
    .filter((e) => e.feedback && e.feedback.rating === 'off' && e.feedback.note)
    .slice(-5)
    .map((e) => ({ date: e.date, correction: e.feedback.note }));
  return { patterns: storedPatterns(), accuracy, corrections };
}

// User feedback on today's brief — stored on the entry AND fed back into
// future context via personalContext(), not just recorded and ignored.
function setBriefFeedback(rating, note) {
  const log = insightLog();
  const today = localDateStr(new Date());
  const entry = log.find((e) => e.date === today && e.kind === 'brief');
  if (!entry) return false;
  entry.feedback = { rating, note: note || null, ts: Date.now() };
  lsSet(MD_INSIGHT_KEY, log);
  mdLog('info', 'accuracy', `feedback recorded: ${rating}${note ? ' — ' + note : ''}`);
  return true;
}
function todaysBriefEntry() {
  return insightLog().find((e) => e.date === localDateStr(new Date()) && e.kind === 'brief') || null;
}

// ========== Trends / self-insight screen ==========
// Pure client-side aggregation over data the accuracy layer + on-device health
// history already log — no new network calls, just a longer-range view onto
// state the app keeps anyway. The exertion blue (#3D7BFF) was validated
// against this app's dark surface with the dataviz skill's contrast + CVD
// checker; the recovery line is near-neutral so it separates from blue for
// every CVD type, and identity is never color-alone (legend + direct labels).
const TREND_REC_COLOR = '#3D7BFF';
const TREND_MIN_DAYS = 3;

function fmtTrendDate(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

// Chart id -> { entries, w, tip(entry) }, read by the shared pointer handler
// below so a tap/hover crosshair works on any inline-SVG trend chart without
// a charting library.
const _trendCharts = {};
function registerTrendChart(id, entries, w, tip, padL, padR) {
  _trendCharts[id] = { entries, w, tip, padL: padL || 0, padR: padR || 0 };
}

function trendChartPointerHandler(e) {
  if (!trendsOpen) return;
  const wrap = e.target.closest('[data-trend-chart]');
  if (!wrap) { trendChartPointerEnd(); return; }
  const chart = _trendCharts[wrap.getAttribute('data-trend-chart')];
  if (!chart || !chart.entries.length) return;
  const svg = wrap.querySelector('svg');
  const rect = svg.getBoundingClientRect();
  if (!rect.width) return;
  const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  // Map the pointer into the PLOT region (between padL/padR), not the raw
  // svg width — the Athlytic-style charts reserve gutters for axis labels.
  const plotW = chart.w - chart.padL - chart.padR;
  const xView = ((clientX - rect.left) / rect.width) * chart.w;
  const frac = Math.max(0, Math.min(1, (xView - chart.padL) / (plotW || 1)));
  const n = chart.entries.length;
  const idx = Math.max(0, Math.min(n - 1, Math.round(frac * (n - 1))));
  const entry = chart.entries[idx];
  const x = chart.padL + (n === 1 ? plotW / 2 : (idx / (n - 1)) * plotW);
  const crosshair = svg.querySelector('.trend-crosshair');
  if (crosshair) { crosshair.style.display = ''; crosshair.setAttribute('x1', x.toFixed(1)); crosshair.setAttribute('x2', x.toFixed(1)); }
  const tip = wrap.querySelector('[data-trend-tip]');
  if (tip) {
    tip.hidden = false;
    tip.textContent = chart.tip(entry);
    tip.style.left = `${Math.max(8, Math.min(92, (x / chart.w) * 100))}%`;
  }
}
function trendChartPointerEnd() {
  document.querySelectorAll('.trend-crosshair').forEach((c) => { c.style.display = 'none'; });
  document.querySelectorAll('[data-trend-tip]').forEach((t) => { t.hidden = true; });
}
document.addEventListener('pointermove', trendChartPointerHandler);
document.addEventListener('pointerdown', trendChartPointerHandler);
document.addEventListener('pointerup', trendChartPointerEnd);
document.addEventListener('pointercancel', trendChartPointerEnd);

function trendLinePath(pts) {
  const segs = [];
  let cur = [];
  pts.forEach((p) => {
    if (p.y == null) { if (cur.length) segs.push(cur); cur = []; }
    else cur.push(p);
  });
  if (cur.length) segs.push(cur);
  return segs.map((seg) => seg.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')).join(' ');
}

// ---- Recovery vs. Exertion (Athlytic-style) ----
// Dual scales that never share an axis line: recovery reads on the RIGHT as
// 0-100% (green top, red bottom), exertion reads on the LEFT as 0.0-10.0
// (strain/10). Both series still plot on the same normalized 0-1 vertical
// space, so the lines are directly comparable the way Athlytic draws them —
// "exertion above recovery" visually means you pushed past your capacity.
// The translucent band is the target exertion range, computed per-day from
// that day's recovery via targetStrainRange().
const TREND_REC_LINE = 'rgba(235,238,245,0.85)';
const TREND_GOOD = '#32d74b';
const TREND_MID = '#ffd60a';
const TREND_BAD = '#ff453a';
function trendBandColor(rec) { return rec >= 67 ? TREND_GOOD : rec >= 34 ? TREND_MID : TREND_BAD; }
function fmtTrendDayShort(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' });
}
function fmtTrendDayNum(dateStr) {
  return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function svgRecoveryExertion(entries) {
  const w = 340, h = 205;
  const padL = 30, padR = 34, padT = 22, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = entries.length;
  const xFor = (i) => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
  const yFor = (v) => padT + (1 - Math.max(0, Math.min(100, v)) / 100) * plotH;

  // Per-day target exertion band from that day's recovery. Drawn as one area
  // polygon per contiguous run of days that have recovery data.
  const bandRuns = [];
  let run = [];
  entries.forEach((e, i) => {
    const t = e.rec != null ? targetStrainRange(e.rec) : null;
    if (t) run.push({ x: xFor(i), lo: yFor(t.lo), hi: yFor(t.hi) });
    else { if (run.length) bandRuns.push(run); run = []; }
  });
  if (run.length) bandRuns.push(run);
  const bandPaths = bandRuns.filter((r) => r.length >= 2).map((r) => {
    const top = r.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.hi.toFixed(1)}`).join(' ');
    const bottom = [...r].reverse().map((p) => `L${p.x.toFixed(1)},${p.lo.toFixed(1)}`).join(' ');
    return `<path d="${top} ${bottom} Z" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>`;
  }).join('');

  // Dashed vertical gridlines + x labels. All 7 days get a line + weekday
  // label; longer ranges get sparse date labels so nothing collides.
  const labelEvery = n <= 8 ? 1 : n <= 32 ? 5 : 10;
  const gridCols = entries.map((e, i) => {
    const x = xFor(i);
    const line = (n <= 8 || i % labelEvery === 0)
      ? `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${padT + plotH}" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="2,4"/>`
      : '';
    const label = (i % labelEvery === 0 || (n > 8 && i === n - 1))
      ? `<text x="${x.toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.5)">${n <= 8 ? fmtTrendDayShort(e.date) : fmtTrendDayNum(e.date)}</text>`
      : '';
    return line + label;
  }).join('');

  const recPts = entries.map((e, i) => ({ x: xFor(i), y: e.rec == null ? null : yFor(e.rec), v: e.rec }));
  const exPts = entries.map((e, i) => ({ x: xFor(i), y: e.strain == null ? null : yFor(e.strain), v: e.strain }));

  // % labels above recovery points, colored by band. Every point on 7 days;
  // sparse on longer ranges to keep the chart readable.
  const recLabels = recPts.map((p, i) => {
    if (p.y == null) return '';
    if (n > 8 && !(i % labelEvery === 0 || i === n - 1)) return '';
    const yLab = Math.max(10, p.y - 8);
    return `<text x="${p.x.toFixed(1)}" y="${yLab.toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="${trendBandColor(p.v)}">${p.v}%</text>`;
  }).join('');
  const recDots = recPts.filter((p) => p.y != null).map((p) =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.4" fill="${trendBandColor(p.v)}" stroke="#0a0b12" stroke-width="1.4"/>`).join('');
  const exDots = exPts.filter((p) => p.y != null).map((p) =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.6" fill="${TREND_REC_COLOR}"/>`).join('');

  registerTrendChart('recstrain', entries, w, (e) => {
    const bits = [];
    if (e.rec != null) bits.push(`Recovery ${e.rec}%`);
    if (e.strain != null) bits.push(`Exertion ${(e.strain / 10).toFixed(1)}`);
    const t = e.rec != null ? targetStrainRange(e.rec) : null;
    if (t) bits.push(`Target ${(t.lo / 10).toFixed(1)}–${(t.hi / 10).toFixed(1)}`);
    return `${fmtTrendDate(e.date)} · ${bits.length ? bits.join(' · ') : 'no data'}`;
  }, padL, padR);

  return `<div class="trend-chart-wrap" data-trend-chart="recstrain">
    <svg viewBox="0 0 ${w} ${h}" class="trend-svg">
      ${bandPaths}
      ${gridCols}
      <text x="${padL - 5}" y="${padT + 4}" text-anchor="end" font-size="10" font-weight="700" fill="${TREND_REC_COLOR}">10.0</text>
      <text x="${padL - 5}" y="${padT + plotH + 3}" text-anchor="end" font-size="10" font-weight="700" fill="${TREND_REC_COLOR}">0.0</text>
      <text x="${w - padR + 5}" y="${padT + 4}" font-size="10" font-weight="700" fill="${TREND_GOOD}">100%</text>
      <text x="${w - padR + 5}" y="${padT + plotH + 3}" font-size="10" font-weight="700" fill="${TREND_BAD}">0%</text>
      <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
      <path d="${trendLinePath(recPts)}" fill="none" stroke="${TREND_REC_LINE}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${trendLinePath(exPts)}" fill="none" stroke="${TREND_REC_COLOR}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${exDots}
      ${recDots}
      ${recLabels}
      <line class="trend-crosshair" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="rgba(255,255,255,0.28)" stroke-width="1" style="display:none"/>
    </svg>
    <div class="trend-legend">
      <span class="trend-leg-item"><span class="trend-leg-line" style="border-color:${TREND_REC_LINE}"></span>Recovery</span>
      <span class="trend-leg-item"><span class="trend-leg-line" style="border-color:${TREND_REC_COLOR}"></span>Exertion</span>
      <span class="trend-leg-item"><span class="trend-leg-band"></span>Target Exertion Range</span>
    </div>
    <div class="trend-tooltip" data-trend-tip hidden></div>
  </div>`;
}

// ---- Sleep vs target: labelled bars that actually say something ----
// Per-bar hour labels, weekday labels, a tagged 8h target line, a dotted
// average line, and short-vs-on-target bar coloring — plus a summary row
// (average, nights on target, current sleep debt) under the legend.
const TREND_SLEEP_SHORT = '#FF9F43';
function svgSleepBars(nights) {
  const w = 340, h = 185;
  const padL = 6, padR = 30, padT = 20, padB = 24;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const target = 8;
  const n = nights.length;
  const maxV = Math.max(target + 1, ...nights.map((night) => night.hours), 1);
  const gap = n > 8 ? 3 : 6;
  const slotW = n ? plotW / n : plotW;
  const barW = Math.max(4, slotW - gap);
  const yFor = (v) => padT + (1 - Math.min(v, maxV) / maxV) * plotH;
  const baseY = padT + plotH;
  const targetY = yFor(target);
  const avg = n ? nights.reduce((s, x) => s + x.hours, 0) / n : 0;
  const avgY = yFor(avg);
  const onTarget = nights.filter((x) => x.hours >= target - 0.05).length;
  const labelEvery = n > 8 ? 2 : 1;

  const bars = nights.map((night, i) => {
    const x = padL + i * slotW + gap / 2;
    const y = yFor(night.hours);
    const met = night.hours >= target - 0.05;
    const fill = met ? TREND_REC_COLOR : TREND_SLEEP_SHORT;
    const cx = x + barW / 2;
    const hoursLab = (i % labelEvery === 0 || i === n - 1)
      ? `<text x="${cx.toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="rgba(255,255,255,0.75)">${(Math.round(night.hours * 10) / 10)}</text>`
      : '';
    const dayLab = (i % labelEvery === 0 || i === n - 1)
      ? `<text x="${cx.toFixed(1)}" y="${h - 7}" text-anchor="middle" font-size="9" font-weight="600" fill="rgba(255,255,255,0.5)">${fmtTrendDayShort(night.date).slice(0, n > 8 ? 1 : 3)}</text>`
      : '';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(2, baseY - y).toFixed(1)}" rx="3" fill="${fill}"/>${hoursLab}${dayLab}`;
  }).join('');

  registerTrendChart('sleepbars', nights, w, (e) => {
    const delta = e.hours - target;
    const deltaTxt = Math.abs(delta) < 0.05 ? 'on target' : delta > 0 ? `+${(Math.round(delta * 10) / 10)}h over` : `${(Math.round(delta * 10) / 10)}h short`;
    return `${fmtTrendDate(e.date)} · ${Math.round(e.hours * 10) / 10}h · ${deltaTxt}`;
  }, padL, padR);

  return `<div class="trend-chart-wrap" data-trend-chart="sleepbars">
    <svg viewBox="0 0 ${w} ${h}" class="trend-svg">
      ${bars}
      <line x1="${padL}" y1="${targetY.toFixed(1)}" x2="${padL + plotW}" y2="${targetY.toFixed(1)}" stroke="rgba(255,255,255,0.55)" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="${w - padR + 4}" y="${(targetY + 3).toFixed(1)}" font-size="9.5" font-weight="700" fill="rgba(255,255,255,0.65)">${target}h</text>
      <line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${padL + plotW}" y2="${avgY.toFixed(1)}" stroke="rgba(52,224,196,0.6)" stroke-width="1" stroke-dasharray="1,4"/>
      <text x="${w - padR + 4}" y="${(avgY + 3).toFixed(1)}" font-size="9.5" font-weight="700" fill="rgba(52,224,196,0.85)">avg</text>
      <line class="trend-crosshair" x1="0" y1="${padT}" x2="0" y2="${baseY}" stroke="rgba(255,255,255,0.28)" stroke-width="1" style="display:none"/>
    </svg>
    <div class="trend-legend">
      <span class="trend-leg-item"><span class="trend-leg-dot" style="background:${TREND_REC_COLOR}"></span>On target</span>
      <span class="trend-leg-item"><span class="trend-leg-dot" style="background:${TREND_SLEEP_SHORT}"></span>Short night</span>
      <span class="trend-leg-item"><span class="trend-leg-line" style="border-top-style:dashed;border-color:rgba(255,255,255,0.55)"></span>${target}h target</span>
    </div>
    <div class="trend-sum-row">
      <div class="trend-sum"><div class="trend-sum-val">${(Math.round(avg * 10) / 10)}h</div><div class="trend-sum-lbl">Avg / night</div></div>
      <div class="trend-sum"><div class="trend-sum-val">${onTarget}/${n}</div><div class="trend-sum-lbl">Nights on target</div></div>
      <div class="trend-sum"><div class="trend-sum-val">${Math.round(rdSleepDebtHours() * 10) / 10}h</div><div class="trend-sum-lbl">Sleep debt</div></div>
    </div>
    <div class="trend-tooltip" data-trend-tip hidden></div>
  </div>`;
}

// "Briefs accurate N of M" from insight-log entries with explicit feedback.
function trendBriefAccuracy() {
  const rated = insightLog().filter((e) => e.kind === 'brief' && e.feedback && e.feedback.rating);
  if (!rated.length) return null;
  return { accurate: rated.filter((e) => e.feedback.rating === 'good').length, total: rated.length };
}
// "Planned vs. did" — brief-suggested tasks actually completed, summed across
// every day with a logged next-day outcome.
function trendPlanAdherence() {
  const withPlan = insightLog().filter((e) => e.outcome && e.outcome.planItems > 0);
  if (!withPlan.length) return null;
  const items = withPlan.reduce((s, e) => s + e.outcome.planItems, 0);
  const done = withPlan.reduce((s, e) => s + e.outcome.planDone, 0);
  return { items, done, days: withPlan.length, pct: Math.round((done / items) * 100) };
}
function trendStatsHtml() {
  const accuracy = trendBriefAccuracy();
  const adherence = trendPlanAdherence();
  const debt = rdSleepDebtHours();
  const stats = [
    `<div class="trend-stat"><div class="trend-stat-val">${accuracy ? `${accuracy.accurate}/${accuracy.total}` : '—'}</div><div class="trend-stat-lbl">Briefs accurate</div></div>`,
    `<div class="trend-stat"><div class="trend-stat-val">${adherence ? `${adherence.pct}%` : '—'}</div><div class="trend-stat-lbl">Plan adherence</div></div>`,
    `<div class="trend-stat"><div class="trend-stat-val">${debt > 0.1 ? `${Math.round(debt * 10) / 10}h` : '0h'}</div><div class="trend-stat-lbl">Sleep debt</div></div>`,
  ];
  return `<div class="trend-stat-row">${stats.join('')}</div>
    ${adherence ? `<div class="trend-empty">${adherence.done} of ${adherence.items} suggested plan items completed across ${adherence.days} day${adherence.days === 1 ? '' : 's'} with logged outcomes.</div>` : ''}`;
}
function trendPatternsHtml() {
  const patterns = storedPatterns();
  if (!patterns.length) {
    return `<section class="glass insight-card"><div class="trend-empty">Personal patterns need a bit more logged history — keep the recovery and sleep data flowing and specific reads (like how short nights affect your next-day recovery) will show up here.</div></section>`;
  }
  return `<section class="glass insight-card">
    ${patterns.map((p) => `<div class="trend-pattern"><span class="trend-pattern-chip ${escapeHtml(p.confidence)}">${escapeHtml(p.confidence)}</span><span>${escapeHtml(p.statement)}</span></div>`).join('')}
  </section>`;
}

let trendsRange = 7; // 7 | 30 | 60 — Athlytic-style range selector
function trendsPageHtml() {
  const histAsc = healthHistEntries(); // ascending, {date, rec, sleepHours, strain}
  const daysLogged = histAsc.length;
  if (daysLogged < TREND_MIN_DAYS) {
    return `<section class="glass insight-card"><div class="trend-empty">Trends need at least ${TREND_MIN_DAYS} days of logged recovery data before there's enough signal to chart${daysLogged ? ` — you've got ${daysLogged} so far.` : ', and nothing is logged yet.'} Keep opening Readiness (or entering recovery manually) each morning and this fills in on its own.</div></section>`;
  }
  const lineEntries = histAsc.slice(-trendsRange);
  const sleepCount = trendsRange === 7 ? 7 : 14;
  const sleepNights = sleepHistory().slice(0, sleepCount).reverse(); // ascending, oldest first
  const seg = (v) => `<button class="trend-seg-btn${trendsRange === v ? ' active' : ''}" data-trends-range="${v}">${v} Days</button>`;
  return `
    ${trendStatsHtml()}
    <section class="glass insight-card">
      <div class="trend-card-title">Recovery vs. Exertion</div>
      <div class="trend-seg">${seg(7)}${seg(30)}${seg(60)}</div>
      ${svgRecoveryExertion(lineEntries)}

// Single settings store; every field is read through getSettings() so a
// fresh install (or an existing install before this shipped) with nothing

const SETTINGS_KEY = 'morningDewSettings';
function getSettings() {
  const s = lsGet(SETTINGS_KEY, {});
  return {
    name: (s.name && String(s.name).trim()) || 'Noah',
    units: s.units === 'f' ? 'f' : 'c',
    homeCoords: s.homeCoords || '',
    widgets: {

      inbox: s.widgets ? s.widgets.inbox !== false : true,
    },
    workDomains: Array.isArray(s.workDomains) ? s.workDomains : [],
  };
}
function saveSettings(patch) {
  const cur = lsGet(SETTINGS_KEY, {});
  lsSet(SETTINGS_KEY, Object.assign({}, cur, patch));
  return getSettings();
}
function tempUnit() { return getSettings().units; }
// Every temperature display in the app should route through here instead of
// interpolating a raw Celsius value — the source data (Open-Meteo) is always
// Celsius; this is the one place that converts for display.
function fmtTemp(celsius, opts) {
  if (celsius == null || !Number.isFinite(Number(celsius))) return '—°';
  const c = Number(celsius);
  const unit = tempUnit();
  const v = unit === 'f' ? Math.round(c * 9 / 5 + 32) : Math.round(c);
  return `${v}°${opts && opts.withUnit ? unit.toUpperCase() : ''}`;
}
// "lat,lon" -> {lat,lon}, or null for anything blank/malformed — loadWeather()
// falls through to device geolocation (then Brisbane) exactly as before when
// this is null, so leaving it unset changes nothing.
function parseHomeCoords(str) {
  if (!str) return null;
  const m = String(str).trim().match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const lat = Number(m[1]), lon = Number(m[2]);
  if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { lat, lon };
}

async function fetchHealth() {
  let ok = true;
  try {
    const res = await fetchWithTimeout(apiUrl('/api/health'));
    const data = await res.json();
    overview.healthConfigured = data.configured;
    if (data.data) {
      overview.health = data.data;
      lsSet(HEALTH_CACHE_KEY, data.data);
      recordHealthHistory(data.data);
      backfillOutcomes();
      recomputePatterns();
    }
    else if (overview.health === undefined) overview.health = lsGet(HEALTH_CACHE_KEY, null);
  } catch {
    ok = false;
    if (overview.health === undefined) overview.health = lsGet(HEALTH_CACHE_KEY, null);
    if (overview.healthConfigured === undefined) overview.healthConfigured = false;
  }
  renderHealth();
  if (healthOpen) renderHealthPage();
  fetchBrief();
  return ok;
}

// ---- "Set Alarm" via Apple Shortcuts ----

// Guardian Open Platform — CORS-enabled JSON API, public test key, no registration.
async function fetchGuardian(qs, source) {
  const url = `https://content.guardianapis.com/search?${qs}&show-fields=thumbnail,trailText&api-key=${GUARDIAN_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Guardian API ${res.status}`);
  const data = await res.json();
  const results = (data && data.response && data.response.results) || [];
  return results.map(r => ({
    title: (r.webTitle || '').replace(/ \| .*$/, '').trim(),
    link: r.webUrl || '',
    description: ((r.fields && r.fields.trailText) || '').replace(/<[^>]+>/g, '').trim(),
    pubDate: r.webPublicationDate || '',
    thumbnail: (r.fields && r.fields.thumbnail) || '',
    source,
  }));
}
async function fetchNews() {
  if (_newsCache && Date.now() - _newsCacheAt < 5 * 60 * 1000) return _newsCache;
  try {
    const articles = await fetchGuardian('order-by=newest&page-size=20', 'The Guardian');
    if (!articles.length) throw new Error('no results');
    _newsCache = { articles, source: 'The Guardian' }; _newsCacheAt = Date.now();
    return _newsCache;
  } catch (err) { return { articles: [], error: String(err.message || err) }; }
}
async function fetchForYou() {
  if (_newsForYouCache && Date.now() - _newsForYouAt < 5 * 60 * 1000) return _newsForYouCache;
  try {
    const articles = await fetchGuardian('section=technology|science|sport|culture|film|music&order-by=newest&page-size=20', 'The Guardian');
    if (!articles.length) throw new Error('no results');
    _newsForYouCache = { articles, source: 'The Guardian' }; _newsForYouAt = Date.now();
    return _newsForYouCache;
  } catch (err) { return { articles: [], error: String(err.message || err) }; }
}
async function searchNews(q) {
  try {
    const articles = await fetchGuardian(`q=${encodeURIComponent(q)}&order-by=relevance&page-size=30`, 'The Guardian');
    return { articles, source: 'The Guardian', query: q };
  } catch (err) { return { articles: [], error: String(err.message || err), query: q }; }
}
function newsTimeAgo(pubDate) {
  if (!pubDate) return '';
  const d = new Date(pubDate);
  if (isNaN(d.getTime())) return '';
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return 'now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}

// ---------- Central system log (in-app, inspectable) ----------
// Ring buffer in localStorage so sync/validation/render problems are reviewable
// from the status sheet (tap the "Updated Xm ago" label), not only in devtools.
const MD_SYSLOG_KEY = 'morningDewSysLog';
function mdLog(level, source, message, extra) {
  try {
    const log = lsGet(MD_SYSLOG_KEY, []);
    log.push({ ts: Date.now(), level, source, message: String(message).slice(0, 300), extra: extra || null });
    while (log.length > 200) log.shift();
    lsSet(MD_SYSLOG_KEY, log);
  } catch { /* quota — logging must never break the app */ }
  const fn = level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log';
  console[fn](`[md:${source}]`, message, extra || '');
}
function mdSysLog() { return lsGet(MD_SYSLOG_KEY, []); }

// ---------- Sync engine ----------
// One registry drives everything: the 10-minute interval, load/focus syncs,
// manual refreshes, per-source freshness skips, stagger, validation and the
// status sheet. Each source syncs independently — one failure never blocks
// the others. setInterval is throttled/suspended in background tabs and
// suspended PWAs, so the visibilitychange/pageshow handlers below are the
// real "resume" trigger; the interval covers the app sitting open.
let lastUpdated = 0;
const SYNC_INTERVAL_MS = 10 * 60 * 1000;  // full cycle cadence
const SYNC_FRESH_MS = 2 * 60 * 1000;      // skip sources refreshed this recently (focus/interval overlap)
const SYNC_STAGGER_MS = 250;              // spacing between parallel call STARTS (rate-limit kindness)
const SYNC_RETRY_MS = 12000;              // one quiet follow-up for failures (covers Render cold starts)
const SYNC_STALE_STREAK = 2;              // failures in a row before we surface a warning

const SYNC_SOURCES = {
  weather:   { label: 'Weather',   run: () => loadWeather(),   validate: () => validateWeather() },
  calendar:  { label: 'Calendar',  run: () => loadCalendar(),  validate: () => validateCalendar() },
  reminders: { label: 'Reminders', run: () => loadReminders(), validate: () => validateReminders() },
  email:     { label: 'Email',     run: () => loadEmail(),     validate: () => validateEmail() },
  health:    { label: 'Readiness', run: () => fetchHealth(),   validate: () => validateHealth() },
};
const syncState = {}; // name -> { lastSuccess, lastAttempt, failStreak, lastError }
function srcState(name) {
  return syncState[name] || (syncState[name] = { lastSuccess: 0, lastAttempt: 0, failStreak: 0, lastError: null });
}

async function syncSource(name, force) {
  const src = SYNC_SOURCES[name];
  const st = srcState(name);
  if (!force && Date.now() - st.lastSuccess < SYNC_FRESH_MS) return 'fresh';
  st.lastAttempt = Date.now();
  try {
    const ok = await src.run();
    if (ok === false) throw new Error('source unreachable');
    st.lastSuccess = Date.now();
    st.failStreak = 0;
    const problem = src.validate ? src.validate() : null;
    if (problem) { st.lastError = problem; mdLog('warn', name, `validation: ${problem}`); }
    else st.lastError = null;
    return 'ok';
  } catch (err) {
    st.failStreak++;
    st.lastError = String((err && err.message) || err);
    // Single blips are routine (see the retry pass below) — only log loudly
    // once a source is actually trending broken.
    mdLog(st.failStreak >= SYNC_STALE_STREAK ? 'error' : 'info', name, `sync failed (streak ${st.failStreak}): ${st.lastError}`);
    return 'fail';
  }
}

let _syncRunning = false;
async function refreshAll(opts = {}) {
  if (_syncRunning) return;
  _syncRunning = true;
  try {
    renderUpdated();
    // Wake the backend a beat early so the /api calls land on a warm container.
    fetchWithTimeout(apiUrl('/')).catch(() => {});
    const names = Object.keys(SYNC_SOURCES).filter((n) => !opts.only || opts.only.includes(n));
    const runs = [];
    for (const name of names) {
      runs.push(syncSource(name, opts.force));
      // Stagger the STARTS, not the completion — calls still run in parallel.
      await new Promise((r) => setTimeout(r, SYNC_STAGGER_MS));
    }
    const results = await Promise.all(runs);
    if (results.includes('ok') || (results.includes('fresh') && !lastUpdated)) lastUpdated = Date.now();
    const failed = names.filter((_, i) => results[i] === 'fail');
    // One quiet follow-up pass for just the failed sources: transient network
    // blips and Render cold starts self-resolve here without ever surfacing.
    if (failed.length && !opts.isRetry) {
      setTimeout(() => refreshAll({ only: failed, force: true, isRetry: true }), SYNC_RETRY_MS);
    }
  } finally {
    _syncRunning = false;
    renderUpdated();
    selfCheck();
  }
}

function fmtAgo(ts) {
  if (!ts) return '';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 45) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  return `${h}h ago`;
}

// Sources that look genuinely broken: repeated consecutive failures, or a
// previously-working source that hasn't succeeded across multiple cycles.
function staleSources() {
  return Object.keys(SYNC_SOURCES).filter((n) => {
    const st = srcState(n);
    if (st.failStreak >= SYNC_STALE_STREAK) return true;
    return !!st.lastSuccess && Date.now() - st.lastSuccess > SYNC_INTERVAL_MS * 2.5;
  });
}

function renderUpdated() {
  const el = document.getElementById('updatedLabel');
  if (!el) return;
  const stale = staleSources();
  const base = lastUpdated ? `Updated ${fmtAgo(lastUpdated)}` : 'Updating…';
  el.textContent = stale.length
    ? `${base} · ⚠︎ ${stale.map((n) => SYNC_SOURCES[n].label).join(', ')} behind`
    : base;
}

// ---------- Data integrity validation ----------
// Shape/range checks run after every successful sync so anomalous data gets
// flagged and logged instead of silently rendering broken. Returning null
// means healthy; "not configured" is a setup state, not an anomaly.
function validateWeather() {
  if (overview.weatherReached === false) return null; // fetch failure, already tracked
  const w = overview.weather;
  if (!w) return 'weather payload empty after successful fetch';
  if (!Number.isFinite(w.temp) || w.temp < -60 || w.temp > 60) return `implausible temperature: ${w.temp}`;
  if (!w.label) return 'missing conditions label';
  return null;
}
function validateCalendar() {
  if (!overview.calendarConfigured) return null;
  if (!Array.isArray(overview.calendar)) return 'calendar is not a list';
  for (const e of overview.calendar.slice(0, 25)) {
    if (!e || typeof e.summary !== 'string') return 'event missing title';
    if (e.start && isNaN(new Date(e.start).getTime())) return `event "${e.summary}" has invalid start date`;
  }
  return null;
}
function validateReminders() {
  if (!overview.remindersConfigured) return null;
  if (!Array.isArray(overview.reminders)) return 'reminders is not a list';
  return null;
}
function validateEmail() {
  if (overview.emailConfigured === false) return null;
  const e = overview.email;
  if (!e) return null; // still loading is fine
  if (!Number.isFinite(e.urgent) || e.urgent < 0) return `implausible urgent count: ${e.urgent}`;
  return null;
}
function validateHealth() {
  const h = overview.health;
  if (!h || h.recovery == null) return null; // no data yet is a setup state
  if (h.recovery < 0 || h.recovery > 100) return `recovery out of range: ${h.recovery}`;
  if (h.sleep != null && (h.sleep < 0 || h.sleep > 100)) return `sleep score out of range: ${h.sleep}`;
  if (h.strain != null && (h.strain < 0 || h.strain > 100)) return `strain out of range: ${h.strain}`;
  if (h.sleepHours != null && (h.sleepHours < 0 || h.sleepHours > 16)) return `implausible sleep hours: ${h.sleepHours}`;
  if (h.restingHeartRate != null && (h.restingHeartRate < 25 || h.restingHeartRate > 130)) return `implausible resting HR: ${h.restingHeartRate}`;
  if (h.hrv != null && (h.hrv < 3 || h.hrv > 350)) return `implausible HRV: ${h.hrv}`;
  return null;
}

// ---------- Self-check: "is anything blank/broken?" ----------
// A lightweight sanity pass after each sync cycle — not a test suite, just
// catches empty/dead critical sections before the user does. Issues must
// persist across two consecutive passes before they surface in the status
// sheet (quiet by default; transient states self-resolve).
let _selfCheckPrev = [];
let _selfCheckConfirmed = [];
function selfCheck() {
  try {
    const issues = [];
    const empty = (id) => { const el = document.getElementById(id); return !el || !el.innerHTML.trim(); };
    if (empty('greetLine')) issues.push('greeting is blank');
    if (overview.weatherReached && empty('weatherCard')) issues.push('weather card is blank');
    if (empty('scheduleCard')) issues.push('schedule card is blank');
    if (empty('healthCard')) issues.push('readiness card is blank');
    if (empty('inboxCard')) issues.push('inbox card is blank');
    if (healthOpen && empty('healthPageContent')) issues.push('readiness page is blank while open');
    if (debriefOpen && empty('debriefContent')) issues.push('debrief page is blank while open');
    _selfCheckConfirmed = issues.filter((i) => _selfCheckPrev.includes(i));
    _selfCheckConfirmed.forEach((i) => mdLog('warn', 'selfcheck', i));
    _selfCheckPrev = issues;
  } catch (err) {
    mdLog('warn', 'selfcheck', `self-check itself failed: ${err && err.message}`);
  }
}

// ---------- Render error boundaries ----------
// Wraps the big render entry points so one broken section logs + shows a
// retry chip (when it owns a host element) instead of an exception blanking
// or freezing the whole app. Top-level function declarations are window
// properties inside this single inline script, so wrap-by-name works.
const MD_BOUNDARIES = {
  renderHealthPage: 'healthPageContent',
  renderDebriefPage: 'debriefContent',
  renderNewsContent: 'newsPageContent',
  renderHome: null,
  renderOverview: null,
  renderToday: null,
  renderHealth: null,
};
function installRenderBoundaries() {
  Object.entries(MD_BOUNDARIES).forEach(([fnName, hostId]) => {
    const orig = window[fnName];
    if (typeof orig !== 'function') { mdLog('warn', 'boundary', `no function named ${fnName} to wrap`); return; }
    window[fnName] = function (...args) {
      try { return orig.apply(this, args); }
      catch (err) {
        mdLog('error', 'render', `${fnName} crashed: ${err && err.message}`, { stack: err && err.stack ? String(err.stack).slice(0, 400) : null });
        if (hostId) {
          const host = document.getElementById(hostId);
          if (host) host.innerHTML = `<div class="md-fallback">This section hit a snag — the rest of the app is fine.
            <button class="md-retry" data-md-retry="${fnName}">Retry</button></div>`;
        }
      }
    };
  });
}
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-md-retry]');
  if (!btn) return;
  const fnName = btn.getAttribute('data-md-retry');
  if (!(fnName in MD_BOUNDARIES)) return; // whitelist — never call arbitrary names
  refreshAll({ force: true });
  const fn = window[fnName];
  if (typeof fn === 'function') fn();
});

// ---------- Status sheet (tap the "Updated Xm ago" label) ----------
let statusSheetOpen = false;
function statusSheetHtml() {
  const dot = (cls) => `<span class="md-dot ${cls}"></span>`;
  const rows = Object.keys(SYNC_SOURCES).map((n) => {
    const st = srcState(n);
    const stale = staleSources().includes(n);
    const cls = stale ? 'bad' : st.lastError ? 'warn' : st.lastSuccess ? 'ok' : 'idle';
    const when = st.lastSuccess ? fmtAgo(st.lastSuccess) : 'never';
    return `<div class="md-src-row">${dot(cls)}<b>${SYNC_SOURCES[n].label}</b>
      <span class="md-src-when">synced ${when}</span>
      ${st.lastError ? `<span class="md-src-err">${escapeHtml(st.lastError)}</span>` : ''}</div>`;
  }).join('');
  const checks = _selfCheckConfirmed.length
    ? _selfCheckConfirmed.map((i) => `<div class="md-log-row"><span class="md-lvl warn">check</span>${escapeHtml(i)}</div>`).join('')
    : '<div class="md-log-empty">All key sections have live data.</div>';
  const log = mdSysLog().slice(-30).reverse().map((e) =>
    `<div class="md-log-row"><span class="md-lvl ${e.level}">${e.level}</span>
      <span class="md-log-src">${escapeHtml(e.source)}</span> ${escapeHtml(e.message)}
      <span class="md-log-when">${fmtAgo(e.ts)}</span></div>`).join('')
    || '<div class="md-log-empty">No warnings or errors logged.</div>';
  return `<div class="md-sheet-hdr"><b>System status</b><button class="md-sheet-close" data-status-close>✕</button></div>
    <div class="md-sheet-sec">Sources</div>${rows}
    <div class="md-sheet-sec">Self-check</div>${checks}
    <div class="md-sheet-sec">Recent log</div><div class="md-log-scroll">${log}</div>
    <div class="md-sheet-actions">
      <button class="md-sheet-btn" data-status-refresh>Force full sync</button>
      <button class="md-sheet-btn" data-status-clearlog>Clear log</button>
    </div>`;
}
function toggleStatusSheet(open) {
  statusSheetOpen = open != null ? open : !statusSheetOpen;
  const el = document.getElementById('statusSheet');
  if (!el) return;
  if (statusSheetOpen) { el.innerHTML = statusSheetHtml(); el.hidden = false; }
  else el.hidden = true;
}
document.addEventListener('click', (e) => {
  if (e.target.closest('#updatedLabel')) { toggleStatusSheet(true); return; }
  if (e.target.closest('[data-status-close]')) { toggleStatusSheet(false); return; }
  if (e.target.closest('[data-status-refresh]')) { refreshAll({ force: true }).then(() => { if (statusSheetOpen) toggleStatusSheet(true); }); return; }
  if (e.target.closest('[data-status-clearlog]')) { lsSet(MD_SYSLOG_KEY, []); toggleStatusSheet(true); return; }
});

// ---------- Detail-screen wiring ----------
document.addEventListener('click', (e) => {
  const trigger = e.target.closest('[data-detail]');
  if (trigger) {
    e.preventDefault();
    const type = trigger.getAttribute('data-detail');
    // The brief gets its own full-screen page (not a translucent sheet) — see Task 1.
    if (type === 'brief') openDebrief();
    else if (type === 'health') openHealth();
    else openDetail(type);
  }
});
// Route the back button and Escape through history so the pushed state is
// consumed (keeps the OS back gesture in sync via the popstate listener).
document.getElementById('detailBack').addEventListener('click', () => { if (currentDetail !== null) history.back(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (currentDetail !== null || debriefOpen || healthOpen || newsOpen || trendsOpen || moreOpen || settingsOpen)) history.back(); });
// Pressing Return in the checklist input adds the reminder and keeps you typing.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'taskInput') { e.preventDefault(); commitTaskInput(); }
});

document.getElementById('pageRefreshBtn').addEventListener('click', (e) => {
  e.currentTarget.classList.remove('spinning');
  // reflow so the animation restarts on every tap
  void e.currentTarget.offsetWidth;
  e.currentTarget.classList.add('spinning');
  refreshAll({ force: true });
});

document.getElementById('newsBack').addEventListener('click', () => { if (newsOpen) history.back(); });
document.querySelectorAll('.news-tab[data-newstab]').forEach(b => b.addEventListener('click', () => switchNewsTab(b.dataset.newstab)));
document.getElementById('newsTabSearch').addEventListener('click', () => { const i = document.getElementById('newsSearchInput'); i.focus(); });
(() => {
  const input = document.getElementById('newsSearchInput');
  const cancel = document.getElementById('newsSearchCancel');
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); runNewsSearch(input.value); } });
  input.addEventListener('input', () => { cancel.hidden = !input.value; });
  cancel.addEventListener('click', () => exitNewsSearch());
})();
document.getElementById('newsPageContent').addEventListener('click', (e) => {
  const btn = e.target.closest('.news-save-btn');
  if (!btn) return;
  e.preventDefault(); e.stopPropagation();
  const nowSaved = toggleNewsSaved(btn.dataset.link);
  btn.classList.toggle('saved', nowSaved);
  btn.innerHTML = nowSaved ? NEWS_BM_FILLED : NEWS_BM_OUTLINE;
  btn.setAttribute('aria-label', nowSaved ? 'Saved for later' : 'Save for later');
  if (newsTab === 'later' && !newsSearching) document.getElementById('newsPageContent').innerHTML = newsSavedHtml();
});
document.getElementById('navHome').addEventListener('click', () => goHome());
document.getElementById('navReadiness').addEventListener('click', () => { closeAllScreens(); openHealth(); });
document.getElementById('navBrief').addEventListener('click', () => { closeAllScreens(); openDebrief(); });
document.getElementById('navInbox').addEventListener('click', () => { closeAllScreens(); openDetail('inbox'); });
document.getElementById('navMore').addEventListener('click', () => { closeAllScreens(); openMore(); });
document.getElementById('healthPage').addEventListener('click', (e) => {
  const back = e.target.closest('#healthBack');
  if (back) { if (healthOpen) history.back(); return; }
  const tab = e.target.closest('[data-rdtab]');
  if (tab) { switchHealthTab(tab.getAttribute('data-rdtab')); return; }
  const fab = e.target.closest('#rdFab');
  if (fab) {
    fab.classList.add('spin');
    Promise.resolve(fetchHealth()).finally(() => { const f = document.getElementById('rdFab'); if (f) f.classList.remove('spin'); });
    return;
  }
  const help = e.target.closest('#rdAlarmHelp');
  if (help) { rdAlarmSetupHelp(); return; }
  // ---- Fitness-home activity planner ----
  const del = e.target.closest('[data-fh-del]');
  if (del) { e.stopPropagation(); fhDeleteActivity(del.getAttribute('data-fh-del')); if (!fhActivities().length) fhEditMode = false; renderHealthPage(); return; }
  const togg = e.target.closest('[data-fh-toggle]');
  if (togg) { if (!fhEditMode) fhToggleActivity(togg.getAttribute('data-fh-toggle')); renderHealthPage(); return; }
  if (e.target.closest('[data-fh-add]')) { fhFormOpen = true; fhEditMode = false; renderHealthPage(); return; }
  if (e.target.closest('[data-fh-cancel]')) { fhFormOpen = false; renderHealthPage(); return; }
  if (e.target.closest('[data-fh-edit]')) { fhEditMode = !fhEditMode; fhFormOpen = false; renderHealthPage(); return; }
  const typeChip = e.target.closest('[data-fh-type]');
  if (typeChip) {
    fhFormType = Number(typeChip.getAttribute('data-fh-type'));
    // Toggle chip selection in place — a full re-render would wipe whatever
    // the user already typed into the custom-name / time inputs.
    document.querySelectorAll('.fh-type-chip').forEach((c) => c.classList.remove('sel'));
    typeChip.classList.add('sel');
    return;
  }
  if (e.target.closest('[data-fh-save]')) {
    const customEl = document.getElementById('fhCustomName');
    const timeEl = document.getElementById('fhTimeInput');
    const custom = customEl ? customEl.value.trim() : '';
    const type = FH_TYPES[fhFormType] || FH_TYPES[0];
    const name = custom || type.name;
    const emoji = custom ? '⭐' : type.emoji;
    const time = (timeEl && /^\d{2}:\d{2}$/.test(timeEl.value)) ? timeEl.value : '';
    fhAddActivity(name, emoji, time);
    fhFormOpen = false;
    renderHealthPage();
    return;
  }
});
document.getElementById('healthPage').addEventListener('change', (e) => {
  const input = e.target.closest('#rdWakeInput');
  if (input && input.value) {
    rdSetWakeTime(input.value);
    if (healthOpen && healthTab === 'sleep') renderHealthPage();
  }
});
// ---------- Pull to refresh ----------
(function setupPullToRefresh() {
  const spinner = document.getElementById('ptrSpinner');
  const THRESHOLD = 70;
  let startY = 0;
  let pulling = false;
  window.addEventListener('touchstart', (e) => {
    if (!currentDetail && !debriefOpen && window.scrollY <= 0 && e.touches.length === 1) {
      startY = e.touches[0].clientY;
      pulling = true;
    } else {
      pulling = false;
    }
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0 && window.scrollY <= 0) {
      const pct = Math.min(1, dy / THRESHOLD);
      spinner.style.opacity = String(pct);
      spinner.style.transform = `translate(-50%, ${Math.min(dy / 2, 40) - 10}px)`;
    }
  }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (!pulling) return;
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > THRESHOLD && window.scrollY <= 0) {
      spinner.classList.add('active');
      spinner.style.opacity = '1';
      refreshAll({ force: true });
      setTimeout(() => {
        spinner.classList.remove('active');
        spinner.style.opacity = '0';
        spinner.style.transform = 'translate(-50%, -10px)';
      }, 1200);
    } else {
      spinner.style.opacity = '0';
      spinner.style.transform = 'translate(-50%, -10px)';
    }
    pulling = false;
  }, { passive: true });
})();

// ---------- Debrief page: edge swipe-back gesture ----------
// Isolated from pull-to-refresh above (which gates on !debriefOpen and
// vertical scroll) so the two gestures never compete on the same touch.
(function setupDebriefSwipeBack() {
  const EDGE = 24, THRESHOLD = 80, MAX_DRIFT = 60;
  let startX = 0, startY = 0, tracking = false;
  window.addEventListener('touchstart', (e) => {
    if (debriefOpen && e.touches.length === 1 && e.touches[0].clientX <= EDGE) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    } else {
      tracking = false;
    }
  }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = Math.abs(e.changedTouches[0].clientY - startY);
    if (dx > THRESHOLD && dy < MAX_DRIFT) history.back();
  }, { passive: true });
})();

// ---------- Refresh on open / focus ----------
// Re-fetch whenever the installed PWA (or tab) is brought back to the
// foreground — the per-source 2-minute freshness gate in syncSource makes
// this safe to fire liberally, so quick app-switches don't re-hit the APIs.
function maybeRefreshOnVisible() {
  if (document.visibilityState === 'visible') refreshAll();
}
document.addEventListener('visibilitychange', maybeRefreshOnVisible);
window.addEventListener('pageshow', maybeRefreshOnVisible);

// ---------- Boot ----------
installRenderBoundaries();
applyWidgetVisibility();
renderGreeting();
applyTheme(); // hour-based theme immediately; weather refines it with is_day
// Seed a cached brief (if today's is stored) so the hero card is instant.
const seededBrief = cachedBrief();
if (seededBrief) { overview.brief = seededBrief.brief; overview.briefStructured = seededBrief.structured; }
renderStreak();
renderOverview();
refreshAll();
// Deep-link support: opening/reloading directly on #/debrief lands on the
// full-screen page instead of the home dashboard.
if (location.hash === '#/debrief') openDebrief();
setInterval(renderUpdated, 30000);
// The 10-minute full-cycle tick. Suspended by the OS while backgrounded —
// maybeRefreshOnVisible covers the wake — so this only fires while open.
setInterval(() => refreshAll(), SYNC_INTERVAL_MS);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
